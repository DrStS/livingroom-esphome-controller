esphome:
  name: wohnzimmer-controller
  friendly_name: "Encoder 1ms Poll Basic"
  on_boot:
    priority: 800
    then:
      - lambda: |-
          gpio_config_t config{};
          config.pin_bit_mask = (1ULL << GPIO_NUM_16) | (1ULL << GPIO_NUM_18);
          config.mode = GPIO_MODE_INPUT;
          config.pull_up_en = GPIO_PULLUP_DISABLE;
          config.pull_down_en = GPIO_PULLDOWN_DISABLE;
          config.intr_type = GPIO_INTR_DISABLE;
          gpio_config(&config);
          id(initialized) = false;
          id(edges_a) = 0;
          id(edges_b) = 0;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework: {type: esp-idf}

logger: {level: INFO}

api:
  encryption:
    key: !secret wohnzimmer_api_key

ota:
  - platform: esphome
    password: !secret wohnzimmer_ota_password

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

globals:
  - {id: initialized, type: bool, initial_value: "false"}
  - {id: last_a, type: bool, initial_value: "false"}
  - {id: last_b, type: bool, initial_value: "false"}
  - {id: level_a, type: bool, initial_value: "false"}
  - {id: level_b, type: bool, initial_value: "false"}
  - {id: edges_a, type: uint32_t, initial_value: "0"}
  - {id: edges_b, type: uint32_t, initial_value: "0"}

interval:
  - interval: 1ms
    then:
      - lambda: |-
          const bool a = gpio_get_level(GPIO_NUM_16) != 0;
          const bool b = gpio_get_level(GPIO_NUM_18) != 0;
          if (!id(initialized)) {
            id(last_a) = a;
            id(last_b) = b;
            id(initialized) = true;
          } else {
            if (a != id(last_a)) id(edges_a)++;
            if (b != id(last_b)) id(edges_b)++;
            id(last_a) = a;
            id(last_b) = b;
          }
          id(level_a) = a;
          id(level_b) = b;

sensor:
  - platform: template
    name: "Encoder A Level"
    update_interval: 100ms
    accuracy_decimals: 0
    lambda: "return id(level_a) ? 1.0f : 0.0f;"
  - platform: template
    name: "Encoder B Level"
    update_interval: 100ms
    accuracy_decimals: 0
    lambda: "return id(level_b) ? 1.0f : 0.0f;"
  - platform: template
    name: "Encoder A Edges"
    update_interval: 100ms
    accuracy_decimals: 0
    lambda: "return (float) id(edges_a);"
  - platform: template
    name: "Encoder B Edges"
    update_interval: 100ms
    accuracy_decimals: 0
    lambda: "return (float) id(edges_b);"


output:
  - platform: ledc
    id: motor_rpwm
    pin: GPIO40
    frequency: 20kHz
  - platform: ledc
    id: motor_lpwm
    pin: GPIO41
    frequency: 20kHz
  - platform: gpio
    id: motor_enable
    pin: GPIO39

button:
  - platform: template
    name: "Poll Counter Reset"
    id: poll_counter_reset
    on_press:
      - lambda: |-
          id(edges_a) = 0;
          id(edges_b) = 0;
  - platform: template
    name: "Motor LPWM 100 Prozent 500 ms"
    id: motor_test_lpwm
    on_press:
      - script.execute: run_lpwm
  - platform: template
    name: "Motor RPWM 100 Prozent 500 ms"
    id: motor_test_rpwm
    on_press:
      - script.execute: run_rpwm
  - platform: template
    name: "Motor STOP"
    on_press:
      - script.stop: run_lpwm
      - script.stop: run_rpwm
      - output.set_level: {id: motor_rpwm, level: 0%}
      - output.set_level: {id: motor_lpwm, level: 0%}
      - output.turn_off: motor_enable

script:
  - id: run_lpwm
    mode: restart
    then:
      - output.set_level: {id: motor_rpwm, level: 0%}
      - output.set_level: {id: motor_lpwm, level: 0%}
      - output.turn_off: motor_enable
      - lambda: |-
          id(edges_a) = 0;
          id(edges_b) = 0;
      - delay: 200ms
      - output.set_level: {id: motor_lpwm, level: 100%}
      - output.turn_on: motor_enable
      - delay: 500ms
      - output.set_level: {id: motor_lpwm, level: 0%}
      - output.turn_off: motor_enable

  - id: run_rpwm
    mode: restart
    then:
      - output.set_level: {id: motor_rpwm, level: 0%}
      - output.set_level: {id: motor_lpwm, level: 0%}
      - output.turn_off: motor_enable
      - lambda: |-
          id(edges_a) = 0;
          id(edges_b) = 0;
      - delay: 200ms
      - output.set_level: {id: motor_rpwm, level: 100%}
      - output.turn_on: motor_enable
      - delay: 500ms
      - output.set_level: {id: motor_rpwm, level: 0%}
      - output.turn_off: motor_enable