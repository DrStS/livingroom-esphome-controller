# =============================================================================
# WOHNZIMMER CONTROLLER
# -----------------------------------------------------------------------------
# ESPHome-Konfiguration fuer den Waveshare ESP32-S3-ETH (W5500), esp-idf.
#
# ECHTE HARDWARE (verifiziert):
#   - Ethernet W5500 (SPI2)
#   - 2x INA226 Strommessung (I2C, 12V/5V-Schiene)
#   - DHT22 (Raum Temp/Feuchte) + 2x DS18B20 (AV-Receiver, Cabinet)
#   - 4-Pin-Luefter: PWM (25 kHz) + Tacho (pulse_counter)
#   - 2x SK6812 RGBW LED-Strips (Zuordnung nach Kabellaenge optimiert):
#       * Sideboard   GPIO45 -> SPI-DMA (SPI3, eigener Treiber, kurzes Kabel)
#       * Glass Edge  GPIO46 -> RMT-DMA (langes Kabel -> mehr Signalreserve)
#   - Motor IBT-2/BTS7960: RPWM/LPWM/Enable (Ausgaenge verdrahtet, per
#     "Motor Test Mode"-Schalter testbar)
#
# NOCH MOCK (bis Motor + Encoder + Endschalter mechanisch verbaut sind):
#   - TV-Lift-Cover (Positions-Simulation ueber Template)
# =============================================================================

substitutions:
  device_name: wohnzimmer-controller
  # Hinweis: Home Assistant haengt den Geraetenamen IMMER als Praefix an die
  # Entity-IDs an (has_entity_name), unabhaengig von friendly_name. Die IDs
  # heissen daher cover.wohnzimmer_controller_tv_lift usw. -- die zentralen
  # Dashboards und das Package verwenden genau dieses Praefix.
  # friendly_name ist optional (nur schoenere Anzeigenamen) und aendert die IDs
  # nicht; aktuell bewusst weggelassen.

packages:
  # Substitutions bleiben bereit fuer den schrittweisen Hardware-Umbau.
  # Aktuell wird nur pin_eth_* (Ethernet) tatsaechlich referenziert.
  pins: !include config/pins.yaml
  hw: !include config/hardware.yaml

esphome:
  name: ${device_name}
  project:
    name: sicklinger.livingroom_controller
    version: "0.1.0"
  # Beim Booten Motor sicher stillsetzen und Luefter sanft anlaufen lassen.
  on_boot:
    priority: -100
    then:
      - output.turn_off: out_motor_enable
      - output.set_level:
          id: out_motor_rpwm
          level: 0%
      - output.set_level:
          id: out_motor_lpwm
          level: 0%
      # Luefter-Anlauf: kurz kraeftiger, damit er sicher losdreht.
      - output.set_level:
          id: out_fan_pwm
          level: 45%
      # Kurzer Delay wartet auf Light-Init.
      - delay: 2s
      # TEST-Startzustand: beide Strips gleichzeitig aktiv, um die Serialisierung
      # zu pruefen -- Sideboard dynamisches Feuer, Cabinet Museum.
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          effect: "Fireplace"
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          effect: "Cabinet Museum"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Eigener SPI-DMA-Treiber fuer den zweiten LED-Strip (interrupt-immun trotz W5500).
external_components:
  - source:
      type: local
      path: components
    components: [spi_clockless_led, serialized_rmt_led, fireplace_effect]

logger:
  level: INFO

# Diagnose-Rohdaten (Heap/Loop-Zeit) fuer die debug-Sensoren.
debug:

api:
  encryption:
    key: !secret wohnzimmer_api_key

ota:
  - platform: esphome
    password: !secret wohnzimmer_ota_password

# Zeitquelle aus Home Assistant -> Tages-Energiezaehler (Reset um Mitternacht).
time:
  - platform: homeassistant
    id: ha_time

ethernet:
  type: W5500
  clk_pin: ${pin_eth_clk}
  mosi_pin: ${pin_eth_mosi}
  miso_pin: ${pin_eth_miso}
  cs_pin: ${pin_eth_cs}
  interrupt_pin: ${pin_eth_interrupt}
  reset_pin: ${pin_eth_reset}

# Zwei getrennte 1-Wire-Busse: je ein DS18B20 (kein Address noetig).
one_wire:
  - platform: gpio
    pin: ${pin_ds18b20_av}
    id: onewire_av
  - platform: gpio
    pin: ${pin_ds18b20_cabinet}
    id: onewire_cabinet

# Gemeinsamer I2C-Bus fuer beide INA226 (Module haben eigene Pull-ups).
i2c:
  id: bus_i2c
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 50kHz

# =============================================================================
# MOCK-ZUSTAND (nur waehrend Mock-Phase; entfaellt beim Umbau auf living_room)
# =============================================================================
globals:
  - id: mock_lift_position
    type: float
    restore_value: yes
    initial_value: "35.0"
  - id: mock_lift_target
    type: float
    restore_value: no
    initial_value: "35.0"
  - id: mock_lift_moving
    type: bool
    restore_value: no
    initial_value: "false"
  - id: mock_lift_homed
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: mock_lift_fault
    type: bool
    restore_value: yes
    initial_value: "false"
  # Aktuelles Luefter-PWM-Duty (0..1), von der Temperatur-Regelung gestellt.
  - id: fan_duty
    type: float
    restore_value: no
    initial_value: "0.35"

# =============================================================================
# LICHTER -- 2 Strips (wie Original-Hardware): Sideboard + Cabinet Glass Edge,
# beide SK6812 RGBW adressierbar. (Es gibt physisch keinen dritten Strip.)
# =============================================================================
output:
  # Luefter-PWM (ECHT, LEDC 25 kHz)
  - platform: ledc
    id: out_fan_pwm
    pin: ${pin_fan_pwm}
    frequency: 25000 Hz

  # Motor IBT-2/BTS7960: 2x LEDC-PWM + Enable als GPIO-Ausgang
  - platform: ledc
    id: out_motor_rpwm
    pin: ${pin_motor_rpwm}
    frequency: ${motor_pwm_frequency}
  - platform: ledc
    id: out_motor_lpwm
    pin: ${pin_motor_lpwm}
    frequency: ${motor_pwm_frequency}
  - platform: gpio
    id: out_motor_enable
    pin: ${pin_motor_ren}

light:
  # --- Sideboard Ambient (ECHT, SK6812 RGBW, GPIO45) ---
  # --- Onboard-RGB-LED des Waveshare-Boards (GPIO21) -> dauerhaft AUS ---
  # GPIO21 ist die Onboard-WS2812. Wird als 1-Pixel-Strip initialisiert und
  # beim Boot mit schwarzem Frame ausgeschaltet. internal -> nicht in HA sichtbar.
  # --- Onboard-RGB-LED des Waveshare-Boards (GPIO21) -> dauerhaft AUS ---
  # GPIO21 ist die Onboard-WS2812. Wird als 1-Pixel-Strip initialisiert und
  # beim Boot mit schwarzem Frame ausgeschaltet. internal -> nicht in HA sichtbar.
  - platform: esp32_rmt_led_strip
    id: onboard_led
    internal: true
    pin: ${pin_onboard_led}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    use_dma: false
    rmt_symbols: 48
    restore_mode: ALWAYS_OFF

  # --- Sideboard Ambient (SK6812 RGBW, GPIO45) ueber SPI-DMA (SPI3) ---
  # Kurzes Kabel -> SPI-DMA laeuft hier sauber. (Langer Weg vertraegt SPI nicht,
  # daher liegt der lange Cabinet-Strip bewusst auf RMT, siehe unten.)
  - platform: spi_clockless_led
    id: light_sideboard_ambient
    output_id: sideboard_ambient_out   # Output-Objekt (RawPixelOutput) fuer Fireplace
    name: "Sideboard"
    pin: ${pin_led_sideboard}
    num_leds: ${led_sideboard_pixels}
    rgb_order: GRB
    is_rgbw: true
    spi_host: SPI3
    # 3,2 MHz -> 4-Bit-SK6812-Kodierung ergibt exakt 1,25 us/Bit (800 kbit/s).
    clock_speed: 3200000
    # Gamma-Korrektur = ESPHome-Standard (2.8). Effektwerte werden als LOGISCHE
    # Pre-Gamma-Werte geschrieben; ESPHome macht Gamma + HA-Slider-Helligkeit
    # automatisch. Kein eigenes powf / keine Slider-Multiplikation im Lambda.
    gamma_correct: 2.8
    restore_mode: RESTORE_DEFAULT_OFF
    # Effektliste ausgelagert: Basis-Effekte ohne Zonen-Effekte.
    effects: !include config/effects_sideboard.yaml
  # --- Cabinet Glass Edge (SK6812 RGBW, GPIO46) ueber RMT-DMA ---
  # Langes Kabel -> RMT hat mehr Signalreserve als der SPI-Stream und laeuft
  # damit auch ueber die lange Leitung einwandfrei (per Treiber-Tausch bestaetigt).
  # Nutzt den einzigen DMA-faehigen RMT-Kanal des S3.
  - platform: serialized_rmt_led
    id: light_cabinet_glass_edge
    output_id: cabinet_glass_edge_out   # Output-Objekt (RawPixelOutput) fuer Fireplace
    name: "Cabinet"
    pin: ${pin_led_glass_edge}
    num_leds: ${led_glass_edge_pixels}
    chipset: SK6812
    rgb_order: GRB
    is_rgbw: true
    # DMA + grosser Puffer (1024): der komplette Frame wird per DMA ausgegeben,
    # ohne ISR-Nachfuellen -> kein Abriss der letzten ~30 LEDs (Non-DMA mit
    # kleinem Puffer lief am Ende leer). Die frueher gefuerchtete GDMA-Kollision
    # mit dem Sideboard-SPI entfaellt, weil beide Strips per Token serialisiert
    # sind (nie gleichzeitiges Senden). 1024 = bewaehrter Init-Wert (4096 war zu
    # gross und liess rmt_new_tx_channel scheitern).
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    max_refresh_rate: 20ms
    # Gamma-Korrektur = ESPHome-Standard (2.8), siehe Sideboard.
    gamma_correct: 2.8
    restore_mode: RESTORE_DEFAULT_OFF
    # Effektliste ausgelagert: Basis-Effekte + zonenbasierte Cabinet-Effekte.
    effects: !include config/effects_cabinet.yaml

# =============================================================================
# LUEFTER (ECHT) -- AUTOMATISCHE Temperatur-Regelung (kein manueller Regler).
# Zieldrehzahl nach AV-Receiver-Temperatur, geschlossener Regelkreis ueber den
# Tacho (out_fan_pwm <- Regelung im interval-Block). Siehe interval: unten.
#   <= 26 C       -> 500 rpm   (leise, Lebenszeichen)
#   26..34 C      -> Zieldrehzahl linear 500 -> 1400 rpm (Regler)
#   > 34 C        -> Vollgas (100 % Duty, ohne Regler)
# =============================================================================

# =============================================================================
# TV-LIFT (Cover) -- derzeit MOCK (Positions-Simulation via Template).
# Wird auf echten Motorbetrieb umgestellt, sobald Motor + Encoder (GPIO16/18)
# + Endschalter mechanisch verbaut und verdrahtet sind. Name "TV Lift" behalten!
# =============================================================================
cover:
  - platform: template
    id: tv_lift
    name: "TV Lift"
    device_class: shade
    has_position: true
    optimistic: false
    lambda: |-
      return id(mock_lift_position) / 100.0f;
    open_action:
      - lambda: |-
          if (!id(mock_lift_fault)) {
            id(mock_lift_target) = 100.0f;
            id(mock_lift_moving) = true;
          }
    close_action:
      - lambda: |-
          if (!id(mock_lift_fault)) {
            id(mock_lift_target) = 0.0f;
            id(mock_lift_moving) = true;
          }
    stop_action:
      - lambda: |-
          id(mock_lift_target) = id(mock_lift_position);
          id(mock_lift_moving) = false;
    position_action:
      - lambda: |-
          if (!id(mock_lift_fault)) {
            id(mock_lift_target) = pos * 100.0f;
            id(mock_lift_moving) = true;
          }

# =============================================================================
# SENSOREN
# ERLEDIGT (Strom): rail_* = 2x INA226 auf gemeinsamem I2C-Bus (${ina226_*}).
# ERLEDIGT (Temp/Feuchte): av/cabinet = DS18B20 (dallas_temp), Raum = DHT22.
# ERLEDIGT (Fan): av_fan_rpm = pulse_counter (${pin_fan_tach}), PWM = out_fan_pwm.
#   Alle Namen/Einheiten unveraendert lassen!
# =============================================================================
sensor:
  # --- INA226 12V-Schiene (ECHT) ---
  - platform: ina226
    address: ${ina226_12v_address}
    shunt_resistance: ${ina226_12v_shunt}
    max_current: ${ina226_12v_max_current}
    adc_time: 1100us
    adc_averaging: 128
    update_interval: 2s
    current:
      name: "Rail 12V Current"
      id: rail_12v_current
    power:
      name: "Rail 12V Power"
      id: rail_12v_power
    bus_voltage:
      name: "Rail 12V Voltage"
      id: rail_12v_voltage
    shunt_voltage:
      name: "Rail 12V Shunt Voltage"
      id: rail_12v_shunt_voltage
      entity_category: diagnostic

  # --- INA226 5V-Schiene (ECHT) ---
  - platform: ina226
    address: ${ina226_5v_address}
    shunt_resistance: ${ina226_5v_shunt}
    max_current: ${ina226_5v_max_current}
    adc_time: 1100us
    adc_averaging: 128
    update_interval: 2s
    current:
      name: "Rail 5V Current"
      id: rail_5v_current
    power:
      name: "Rail 5V Power"
      id: rail_5v_power
    bus_voltage:
      name: "Rail 5V Voltage"
      id: rail_5v_voltage
    shunt_voltage:
      name: "Rail 5V Shunt Voltage"
      id: rail_5v_shunt_voltage
      entity_category: diagnostic

  # --- Energie kumuliert pro Schiene (integriert die Leistung ueber die Zeit) ---
  - platform: total_daily_energy
    name: "Rail 12V Energy Daily"
    id: rail_12v_energy_daily
    power_id: rail_12v_power
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    state_class: total_increasing
    device_class: energy
  - platform: total_daily_energy
    name: "Rail 5V Energy Daily"
    id: rail_5v_energy_daily
    power_id: rail_5v_power
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    state_class: total_increasing
    device_class: energy

  # --- Gesamtleistung (12V + 5V) ---
  - platform: template
    name: "Rail Total Power"
    id: rail_total_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      float a = id(rail_12v_power).state;
      float b = id(rail_5v_power).state;
      if (isnan(a)) a = 0.0f;
      if (isnan(b)) b = 0.0f;
      return a + b;

  # --- Temperaturen (DS18B20, ECHT, je eigener 1-Wire-Bus) ---
  - platform: dallas_temp
    one_wire_id: onewire_av
    name: "AV Receiver Temperature"
    id: av_receiver_temperature
    update_interval: 10s
  - platform: dallas_temp
    one_wire_id: onewire_cabinet
    name: "Cabinet Temperature"
    id: cabinet_temperature
    update_interval: 10s

  # --- Raum Temp/Feuchte (DHT22, ECHT) ---
  - platform: dht
    pin: ${pin_dht}
    model: DHT22
    update_interval: 30s
    temperature:
      name: "Livingroom Temperature"
      id: livingroom_temperature
    humidity:
      name: "Livingroom Humidity"
      id: livingroom_humidity

  # --- Luefter-Drehzahl (ECHT, pulse_counter) ---
  # 2 Pulse/Umdrehung -> multiply 0.5 rechnet pulses/min in rpm um.
  # pullup: true nutzt den internen Pull-up (falls kein externer bestueckt).
  - platform: pulse_counter
    name: "AV Fan RPM"
    id: av_fan_rpm
    pin:
      number: ${pin_fan_tach}
      mode:
        input: true
        pullup: true
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - multiply: 0.5

  # --- Luefter-Duty (Diagnose, von der Temperatur-Regelung gestellt) ---
  - platform: template
    name: "AV Fan Duty"
    id: av_fan_duty
    unit_of_measurement: "%"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: 'return id(fan_duty) * 100.0f;'

  # --- System-Diagnose ---
  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    entity_category: diagnostic
    update_interval: 30s
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    entity_category: diagnostic
    update_interval: 30s
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

  # --- Lift-Diagnose (Mock) ---
  - platform: template
    name: "TV Lift Position Pulses"
    id: tv_lift_position_pulses
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return id(mock_lift_position) / 100.0f * 940.0f;'
  - platform: template
    name: "TV Lift Position Percent"
    id: tv_lift_position_percent
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return id(mock_lift_position);'

binary_sensor:
  # --- Ueberstrom-Warnung je Schiene (Schwellen in config/hardware.yaml) ---
  - platform: template
    name: "Rail 12V Overcurrent"
    id: rail_12v_overcurrent
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const float c = id(rail_12v_current).state;
      if (isnan(c)) return false;
      return c > ${ina226_12v_warn_current}f;
  - platform: template
    name: "Rail 5V Overcurrent"
    id: rail_5v_overcurrent
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const float c = id(rail_5v_current).state;
      if (isnan(c)) return false;
      return c > ${ina226_5v_warn_current}f;
  - platform: template
    name: "TV Lift Homed"
    id: tv_lift_homed
    lambda: 'return id(mock_lift_homed);'
  - platform: template
    name: "TV Lift Fault"
    id: tv_lift_fault
    device_class: problem
    lambda: 'return id(mock_lift_fault);'
  # API-Verbindungsstatus (Home Assistant erreichbar?)
  - platform: status
    name: "API Connected"
    id: sys_api_connected
    entity_category: diagnostic

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

button:
  - platform: template
    name: "TV Lift Reference"
    id: tv_lift_reference
    on_press:
      - lambda: |-
          id(mock_lift_position) = 0.0f;
          id(mock_lift_target) = 0.0f;
          id(mock_lift_homed) = true;
          id(mock_lift_fault) = false;
          id(mock_lift_moving) = false;
  - platform: template
    name: "TV Lift Clear Fault"
    id: tv_lift_clear_fault
    on_press:
      - lambda: |-
          id(mock_lift_fault) = false;
  # Neustart per HA (u. a. um den 1-Wire-Bus neu zu scannen).
  - platform: restart
    name: "Controller Restart"
    id: controller_restart
  # LED-Verdrahtungs-Selbsttest (siehe Skript led_wiring_test).
  - platform: template
    name: "LED Wiring Test"
    id: led_wiring_test_button
    on_press:
      - script.execute: led_wiring_test

switch:
  # Bring-up-Test fuer den Motor (IBT-2): solange EIN, faehrt der Motor im
  # 5-s-Takt abwechselnd links/rechts mit 50 % Duty. Standard AUS.
  # ACHTUNG SICHERHEIT: kein Endschalter-Schutz -> nur bei freilaufender
  # Mechanik oder unter Aufsicht mit griffbereiter Stromtrennung einschalten!
  - platform: template
    name: "Motor Test Mode"
    id: motor_test_mode
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - lambda: |-
          id(out_motor_enable).turn_off();
          id(out_motor_rpwm).set_level(0.0f);
          id(out_motor_lpwm).set_level(0.0f);

select:
  - platform: template
    name: "Livingroom Light Scene"
    id: livingroom_light_scene
    optimistic: true
    options: [Manual, Museum, Fireplace, Fireplace Palette, Fireworks]
    initial_option: Manual
    on_value:
      - script.execute: apply_light_scene

number:
  - platform: template
    name: "Livingroom Effect Intensity"
    id: livingroom_effect_intensity
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60
    on_value:
      - script.execute: apply_light_scene
  # Hinweis: Ein frueherer "Livingroom Effect Speed"-Regler wurde entfernt. Der
  # Fireplace-Flicker laeuft in einem physikalisch motivierten festen Frequenz-
  # band (~9-13 Hz) im C++-Effekt und wurde nie an einen Speed-Wert gebunden;
  # ein 0-100-Regler waere daher funktionslos/irrefuehrend gewesen.


# =============================================================================
# SZENEN-ENGINE (Mock)
# Setzt Farbe/Weiss/Helligkeit + ESPHome-Effekt aller drei Lichter je nach
# ausgewaehlter "Livingroom Light Scene". Intensity steuert die Helligkeit.
# TODO HARDWARE (LED): Bei adressierbaren Strips hier zusaetzlich Speed und
# per-Pixel-Effekte nutzen (addressable_lambda).
# =============================================================================
script:
  # LED-Verdrahtungs-Selbsttest. Ablauf (beide Strips):
  #  1) Nur Sideboard rot / nur Glass Edge rot -> Pin-Zuordnung, nicht vertauscht
  #  2) R -> G -> B -> W auf beiden -> Farbreihenfolge (GRB) + RGBW-Weisskanal
  #  3) Pixel Walk -> LED-Anzahl, Laufrichtung, tote Pixel
  - id: led_wiring_test
    mode: restart
    then:
      # 1) Pin-Zuordnung
      - light.turn_off: light_cabinet_glass_edge
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
          effect: "None"
      - delay: 2s
      - light.turn_off: light_sideboard_ambient
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
          effect: "None"
      - delay: 2s
      # 2) Farbreihenfolge + RGBW (beide gleichzeitig): ROT
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
      - delay: 1500ms
      # GRUEN
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 100%
          blue: 0%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 100%
          blue: 0%
          white: 0%
      - delay: 1500ms
      # BLAU
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 0%
          blue: 100%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 0%
          blue: 100%
          white: 0%
      - delay: 1500ms
      # WEISS (nur W-Kanal)
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 0%
          blue: 0%
          white: 100%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 0%
          blue: 0%
          white: 100%
      - delay: 2s
      # 3) Pixel Walk (Anzahl / Richtung / tote Pixel)
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          effect: "None"
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          effect: "None"

  - id: apply_light_scene
    then:
      - lambda: |-
          auto set_light = [](light::LightState *l, float r, float g, float b,
                              float w, float bri, const char *eff) {
            // Intensitaet 0 bedeutet wirklich AUS (keine 2 %-Resthelligkeit,
            // sonst leuchten Effekte mit Grundanteil weiter schwach).
            if (bri <= 0.0f) {
              l->turn_off().perform();
              return;
            }
            auto call = l->turn_on();
            call.set_rgb(r, g, b);
            call.set_white(w);
            call.set_brightness(bri);
            call.set_effect(eff);
            call.perform();
          };
          auto clear_eff = [](light::LightState *l) {
            if (l->remote_values.is_on()) {
              auto call = l->turn_on();
              call.set_effect("None");
              call.perform();
            }
          };
          const auto s = id(livingroom_light_scene).current_option();
          const float bri = id(livingroom_effect_intensity).state / 100.0f;
          if (s == "Manual") {
            clear_eff(id(light_sideboard_ambient));
            clear_eff(id(light_cabinet_glass_edge));
          } else if (s == "Museum") {
            // Cabinet: Vitrinen-Look (Effekt steuert Farben pro Pixel); Sideboard aus.
            // Helligkeit folgt jetzt dem Intensity-Regler (bri) statt fix 100 %.
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.45f, 0.0f, 1.0f, bri, "Cabinet Museum");
            id(light_sideboard_ambient)->turn_off().perform();
          } else if (s == "Fireplace") {
            // Beide Strips mit dem Raw-Kaminfeuer; HA-Slider (bri) steuert die
            // Helligkeit ueber current_values im Effekt selbst.
            set_light(id(light_sideboard_ambient), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace");
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace");
          } else if (s == "Fireplace Palette") {
            set_light(id(light_sideboard_ambient), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace Palette");
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace Palette");
          } else if (s == "Fireworks") {
            set_light(id(light_sideboard_ambient), 1.0f, 1.0f, 1.0f, 0.0f, bri, "Fireworks");
            set_light(id(light_cabinet_glass_edge), 1.0f, 1.0f, 1.0f, 0.0f, bri, "Fireworks");
          }

# =============================================================================
# MOCK-BEWEGUNG: Lift-Position laeuft in Richtung Ziel (entfaellt beim Umbau).
# =============================================================================
interval:
  - interval: 200ms
    then:
      - lambda: |-
          if (id(mock_lift_moving)) {
            float delta = id(mock_lift_target) - id(mock_lift_position);
            if (fabsf(delta) < 0.8f) {
              id(mock_lift_position) = id(mock_lift_target);
              id(mock_lift_moving) = false;
            } else {
              id(mock_lift_position) += (delta > 0.0f ? 0.8f : -0.8f);
            }
          }

  # Luefter-Temperatur-Regelung (jede Sekunde), lineare Kennlinie:
  #   <= 26 C -> 500 rpm, 26..34 C -> linear bis 1400 rpm (Regler),
  #   > 34 C -> Vollgas (100 % Duty, ohne Regler; 0,5 C Hysterese).
  - interval: 1s
    then:
      - lambda: |-
          static bool full = false;
          const float t = id(av_receiver_temperature).state;   // kann NaN sein
          if (!isnan(t)) {
            if (t >= 34.0f) full = true;
            else if (t < 33.5f) full = false;
          }

          float duty = id(fan_duty);
          if (full) {
            duty = 1.0f;                         // Vollgas ohne Regler
          } else {
            // Zieldrehzahl linear zwischen 26 C/500 rpm und 34 C/1400 rpm.
            float target;
            if (isnan(t)) {
              target = 500.0f;                   // Fallback ohne Temp-Wert
            } else {
              float tc = t;
              if (tc < 26.0f) tc = 26.0f;
              if (tc > 34.0f) tc = 34.0f;
              target = 500.0f + (tc - 26.0f) / (34.0f - 26.0f) * (1400.0f - 500.0f);
            }
            const float rpm = id(av_fan_rpm).state;
            if (isnan(rpm) || rpm < 100.0f) {
              duty = fmaxf(duty, 0.45f);         // Anlauf-Kick, falls Luefter steht
            } else {
              duty += 0.00015f * (target - rpm); // Integralregler auf Ziel-RPM
            }
            if (duty < 0.10f) duty = 0.10f;      // Mindest-Duty (dreht noch)
            if (duty > 1.0f)  duty = 1.0f;
          }
          id(fan_duty) = duty;
          id(out_fan_pwm).set_level(duty);

  # Motor-Bring-up-Test: nur aktiv, solange "Motor Test Mode" EIN ist.
  # 5 s links, dann 5 s rechts, 50 % Duty. Vor jedem Umschalten die Gegenseite
  # zuerst auf 0 (verhindert BTS7960-Shoot-Through der Halbbruecken).
  - interval: 5s
    then:
      - if:
          condition:
            switch.is_on: motor_test_mode
          then:
            # Definierte Totzeit gegen BTS7960-Shoot-Through: erst BEIDE
            # Halbbruecken auf 0 und Enable weg, kurz warten (Gate-Ladungen
            # abbauen), dann neue Richtung setzen und erst danach Enable an.
            - output.set_level:
                id: out_motor_rpwm
                level: 0%
            - output.set_level:
                id: out_motor_lpwm
                level: 0%
            - output.turn_off: out_motor_enable
            - delay: 50ms
            - lambda: |-
                static bool right = false;
                right = !right;
                if (right) {
                  id(out_motor_rpwm).set_level(0.5f);
                } else {
                  id(out_motor_lpwm).set_level(0.5f);
                }
            - output.turn_on: out_motor_enable

