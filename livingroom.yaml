# =============================================================================
# WOHNZIMMER CONTROLLER
# -----------------------------------------------------------------------------
# ESPHome-Konfiguration fuer den Waveshare ESP32-S3-ETH (W5500), esp-idf.
#
# ECHTE HARDWARE (verifiziert):
#   - Ethernet W5500 (SPI2)
#   - 2x INA226 Strommessung (I2C, 12V/5V-Schiene)
#   - DHT22 (Raum Temp/Feuchte) + 2x DS18B20 (AV-Receiver, Cabinet)
#   - 4-Pin-Luefter: PWM (25 kHz) + Tacho (pulse_counter)
#   - 2x SK6812 RGBW LED-Strips (Zuordnung nach Kabellaenge optimiert):
#       * Sideboard   GPIO45 -> SPI-DMA (SPI3, eigener Treiber, kurzes Kabel)
#       * Glass Edge  GPIO46 -> RMT-DMA (langes Kabel -> mehr Signalreserve)
#   - Motor IBT-2/BTS7960: RPWM/LPWM/Enable mit PCNT-Quadraturencoder;
#     LiftMotor ist alleiniger aktiver Owner der Ausgaenge.
#   - TV-Lift-Cover mit echter Position nach manueller Referenzierung
# =============================================================================

substitutions:
  device_name: wohnzimmer-controller
  # Hinweis: Home Assistant haengt den Geraetenamen IMMER als Praefix an die
  # Entity-IDs an (has_entity_name), unabhaengig von friendly_name. Die IDs
  # heissen daher cover.wohnzimmer_controller_tv_lift usw. -- die zentralen
  # Dashboards und das Package verwenden genau dieses Praefix.
  # friendly_name ist optional (nur schoenere Anzeigenamen) und aendert die IDs
  # nicht; aktuell bewusst weggelassen.

packages:
  # Substitutions bleiben bereit fuer den schrittweisen Hardware-Umbau.
  # Aktuell wird nur pin_eth_* (Ethernet) tatsaechlich referenziert.
  pins: !include config/pins.yaml
  hw: !include config/hardware.yaml

esphome:
  name: ${device_name}
  project:
    name: sicklinger.livingroom_controller
    version: "0.1.0"
  # Bootaktionen betreffen nur den Luefter und das Wiederherstellen der Szene.
  # LiftMotor setzt den Motor in setup() sicher aus; hier darf keinerlei
  # Motorfahrt oder Motorausgabe stehen.
  #
  # ZUSTAND NACH STROMAUSFALL: Beide Strips stellen ihren letzten Zustand selbst
  # wieder her (restore_mode: RESTORE_DEFAULT_OFF -- Helligkeit, Farbe, Effekt
  # und Ein/Aus liegen im NVS). Frueher stand hier ein fester Teststartzustand,
  # der genau das ueberschrieben hat; er ist entfernt.
  on_boot:
    priority: -100
    then:
      # Luefter-Anlauf: kurz kraeftiger, damit er sicher losdreht.
      - output.set_level:
          id: out_fan_pwm
          level: 45%
      # Kurzer Delay wartet auf Light-Init.
      - delay: 2s
      # War eine Szene aktiv, wird sie erneut angewendet -- sonst behalten die
      # Lichter einfach ihren wiederhergestellten Einzelzustand. Das Anwenden
      # erfolgt bewusst erst hier, wenn alle Lichter initialisiert sind.
      - if:
          condition:
            lambda: 'return id(livingroom_light_scene).current_option() != "Manual";'
          then:
            - script.execute: apply_light_scene
  # Beim geregelten Herunterfahren laufen die on_shutdown-Hooks in umgekehrter
  # Setup-Reihenfolge. Prioritaet 1000 ordnet diesen Hook direkt vor dem
  # ESPHome-Preferences-Syncer ein: Erst Motor aus und alle Pending-Zustaende
  # unter kooperativer Task-Pause synchronisieren, danach ist der Framework-
  # Sync nur noch ein leerer Aufruf ohne Flashzugriff.
  on_shutdown:
    - priority: 1000
      then:
        - lambda: |-
            id(lift)->stop();
            if (id(lift)->sync_preferences_safely())
              ESP_LOGI("shutdown", "Lift aus; Preferences vor Shutdown sicher synchronisiert.");
            else
              ESP_LOGE("shutdown", "Preferences konnten vor Shutdown nicht sicher synchronisiert werden.");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# ESPHomes normaler 60-s-Sync lief unkoordiniert parallel zum 1-ms-Regeltask.
# Der automatische Framework-Intervallsync ist deshalb vollstaendig deaktiviert;
# alle vorgemerkten Zustaende werden unten alle 5 s ueber
# LiftMotor::sync_preferences_safely() geschrieben. Ohne Pending-Aenderungen
# kehrt ESP32Preferences::sync() ohne Flashzugriff sofort zurueck. Der weiterhin
# vorhandene Framework-Shutdown-Sync ist leer, weil der on_shutdown-Hook oben
# unmittelbar vorher sicher synchronisiert.
preferences:
  flash_write_interval: never

# =============================================================================
# POSITIONSREGELUNG auf eigenem FreeRTOS-Task (Kern 1, fester 1-ms-Takt).
# LiftMotor ist alleiniger Motor-Owner, liest PCNT direkt und startet den Task
# in setup(). Der Taskstart selbst gibt den Motor nicht frei.
# Logische Richtung: positive Encoderposition/LPWM = Oeffnen/Aufwaerts;
# 0 = geschlossen/unten, 940 = offen/oben. Die Motorzuordnung und
# invert_direction=true wurden am realen Aufbau bestaetigt.
# =============================================================================
lift_motor:
  id: lift
  rpwm: out_motor_rpwm
  lpwm: out_motor_lpwm
  enable: out_motor_enable
  encoder: motor_encoder
  min_position: 0
  max_position: ${lift_top_position_pulses}
  period: 1ms
  task_core: 1
  task_priority: 10
  # Duty ist nur noch Stellgroesse des Geschwindigkeitsreglers.
  # duty_min_up/down = richtungsabhaengige Vorsteuerung (Losbrechmoment),
  # duty_max = Saettigungsgrenze des Reglers. Reicht der Lift max_speed nicht,
  # ist zuerst duty_max anzuheben.
  # Toleranz in Counts: bei 1500 Counts/s ist 1 Count nicht sinnvoll haltbar.
  tolerance: 4
  duty_min_up: 14%
  duty_min_down: 12%
  # 1500 Counts/s brauchen rund 62 Prozent Duty; 90 Prozent lassen dem Regler
  # Reserve fuer Last, Reibung und Aufwaertsfahrt.
  duty_max: 90%
  # error_full wird von der Geschwindigkeitsregelung nicht mehr genutzt
  # (Altwert der frueheren Duty-Kennlinie, nur zur Kompatibilitaet).
  error_full: 12.0
  fine_window: 6
  pulse_period: 4
  brake_time: 200ms
  # Der PI-Regler braucht beim Losbrechen Zeit, bis der I-Anteil genug Duty
  # aufgebaut hat -- daher 800 ms statt 500 ms. Schutz gegen echte Blockade
  # bleibt voll erhalten (Zaehler laeuft nur bei Sollgeschwindigkeit > 0).
  stall_time: 800ms
  # --- Trapezprofil, alles in Encoder-Counts pro Sekunde ---
  # 144 Counts/mm laut Uebersetzung (12 x 48 / 4 mm). 1500 Counts/s sind damit
  # rund 10,4 mm/s; der volle Hub (94500 Counts = 656,25 mm) dauert etwa 63 s,
  # was der beobachteten Fahrzeit entspricht.
  max_speed: 1500
  # Beschleunigen/Bremsen in Counts/s^2. Bewusst flach, damit der Lift sanft
  # anfaehrt statt praktisch sofort auf Marschfahrt zu springen:
  #   accel 300 -> 1500 Counts/s erst nach 5 s (Weg dabei rund 26 mm)
  #   decel 500 -> Auslauf ueber 3 s, kuerzerer Bremsweg als der Anfahrweg
  # Zum Vergleich: die vorherigen 2500 erreichten max_speed in 0,6 s.
  accel: 300
  decel: 500
  # Kriechgeschwindigkeit auf dem letzten Stueck, damit das Ziel wirklich
  # erreicht und nicht kurz davor "stehengelassen" wird.
  approach_speed: 150
  # --- PI-Regler auf die gemessene Encodergeschwindigkeit ---
  # Konservative Startwerte, MUESSEN am realen Lift kalibriert werden:
  # zuerst speed_kp erhoehen, bis die Fahrt zuegig folgt, dann speed_ki, bis
  # die Geschwindigkeit lastunabhaengig (auf/ab) gleich bleibt.
  speed_kp: 0.0006
  speed_ki: 0.004
  # Messfenster der Geschwindigkeit (Encoderquantisierung) und EMA-Filter.
  speed_window: 20ms
  speed_filter: 0.35
  # Zeitgrenze einer geregelten Positionsfahrt. Der volle Hub betraegt 94500
  # Counts (656,25 mm), bei 1500 Counts/s also etwa 63 s -- 90 s lassen
  # Reserve fuer Rampen und Nachkorrektur.
  timeout: 90s
  # Zeitgrenze einer manuellen Pfeilfahrt: muss den gesamten Hub abdecken
  # (94500 Counts / 656,25 mm, etwa 63 s). Gegen Anschlag/Blockade schuetzt
  # weiterhin die Stall-Abschaltung.
  manual_timeout: 90s
  # --- Stromausfallsicherheit ---
  # Position und Referenz liegen im NVS. Die Mechanik ist selbsthemmend
  # (Getriebe auf Trapezgewinde), ohne Strom bleibt der Lift stehen -- der
  # gespeicherte Stand ist daher nach dem Neustart weiter gueltig.
  # Geschrieben wird NUR bei Fahrtbeginn (moving=true) und nach Fahrtende,
  # sobald drei Sekunden lang kein Encoderpuls mehr kam (moving=false). Jeder
  # spaete Puls startet die Ruhezeit neu. Damit bleibt es bei hoechstens zwei
  # Flash-Schreibvorgaengen pro Fahrt; es gibt kein periodisches Speichern.
  # Wird die Versorgung waehrend einer Fahrt oder vor dem stabilen Endstand
  # getrennt, bleibt moving=true gespeichert und der Lift startet bewusst
  # unreferenziert statt mit einer moeglicherweise falschen Position.
  #
  # Die Wiederherstellung liest den NVS-Datensatz in setup() nur ein und setzt
  # im ersten loop()-Durchlauf ausschliesslich den atomaren Positionsoffset.
  # LiftMotor schreibt niemals in den PCNT-Encoder. Damit gibt es keinen
  # konkurrierenden Encoder-Schreibzugriff zwischen Mainloop und 1-ms-Regeltask.
  # Die genaue fruehere Absturzursache ist ohne Crashlog nicht bewiesen; diese
  # Architektur entfernt jedoch diese Race-Klasse vollstaendig.
  # Position und Referenz ueberleben Stromausfall und OTA.
  persist_position: true

# Eigener SPI-DMA-Treiber fuer den zweiten LED-Strip (interrupt-immun trotz W5500).
external_components:
  - source:
      type: local
      path: components
    components: [spi_clockless_led, serialized_rmt_led, fireplace_effect, lift_motor, pcnt_quadrature]

logger:
  level: INFO

# Diagnose-Rohdaten (Heap/Loop-Zeit) fuer die debug-Sensoren.
debug:

api:
  encryption:
    key: !secret wohnzimmer_api_key

ota:
  - platform: esphome
    password: !secret wohnzimmer_ota_password
    # Sicherheitshalt vor dem Update: waehrend des OTA-Schreibens wird der
    # Flash-Cache abgeschaltet. Code, der im Flash liegt, kann dann nicht
    # ausgefuehrt werden -- auch der Regeltask auf Kern 1 nicht. Eine laufende
    # PWM wuerde also weiter ausgegeben, ohne dass Regelung oder Watchdog
    # eingreifen koennen. Deshalb hier zuerst geordnet stillsetzen.
    on_begin:
      - lambda: |-
          id(lift)->stop();
          if (id(lift)->sync_preferences_safely())
            ESP_LOGW("ota", "OTA startet -- Lift aus; Preferences sicher synchronisiert.");
          else
            ESP_LOGE("ota", "OTA startet mit ausgeschaltetem Lift, Preferences-Sync jedoch fehlgeschlagen.");

# Zeitquelle aus Home Assistant -> Tages-Energiezaehler (Reset um Mitternacht).
time:
  - platform: homeassistant
    id: ha_time

ethernet:
  type: W5500
  clk_pin: ${pin_eth_clk}
  mosi_pin: ${pin_eth_mosi}
  miso_pin: ${pin_eth_miso}
  cs_pin: ${pin_eth_cs}
  interrupt_pin: ${pin_eth_interrupt}
  reset_pin: ${pin_eth_reset}

# Zwei getrennte 1-Wire-Busse: je ein DS18B20 (kein Address noetig).
one_wire:
  - platform: gpio
    pin: ${pin_ds18b20_av}
    id: onewire_av
  - platform: gpio
    pin: ${pin_ds18b20_cabinet}
    id: onewire_cabinet

# Gemeinsamer I2C-Bus fuer beide INA226 (Module haben eigene Pull-ups).
i2c:
  id: bus_i2c
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 50kHz

globals:
  # Aktuelles Luefter-PWM-Duty (0..1), von der Temperatur-Regelung gestellt.
  - id: fan_duty
    type: float
    restore_value: no
    initial_value: "0.35"


# =============================================================================
# LICHTER -- 2 Strips (wie Original-Hardware): Sideboard + Cabinet Glass Edge,
# beide SK6812 RGBW adressierbar. (Es gibt physisch keinen dritten Strip.)
# =============================================================================
output:
  # Luefter-PWM (ECHT, LEDC 25 kHz)
  - platform: ledc
    id: out_fan_pwm
    pin: ${pin_fan_pwm}
    frequency: 25000 Hz

  # Motor IBT-2/BTS7960: 2x LEDC-PWM + Enable als GPIO-Ausgang
  - platform: ledc
    id: out_motor_rpwm
    pin: ${pin_motor_rpwm}
    frequency: ${motor_pwm_frequency}
  - platform: ledc
    id: out_motor_lpwm
    pin: ${pin_motor_lpwm}
    frequency: ${motor_pwm_frequency}
  - platform: gpio
    id: out_motor_enable
    pin: ${pin_motor_ren}

light:
  # --- Sideboard Ambient (ECHT, SK6812 RGBW, GPIO45) ---
  # --- Onboard-RGB-LED des Waveshare-Boards (GPIO21) -> dauerhaft AUS ---
  # GPIO21 ist die Onboard-WS2812. Wird als 1-Pixel-Strip initialisiert und
  # beim Boot mit schwarzem Frame ausgeschaltet. internal -> nicht in HA sichtbar.
  # --- Onboard-RGB-LED des Waveshare-Boards (GPIO21) -> dauerhaft AUS ---
  # GPIO21 ist die Onboard-WS2812. Wird als 1-Pixel-Strip initialisiert und
  # beim Boot mit schwarzem Frame ausgeschaltet. internal -> nicht in HA sichtbar.
  - platform: esp32_rmt_led_strip
    id: onboard_led
    internal: true
    pin: ${pin_onboard_led}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    use_dma: false
    rmt_symbols: 48
    restore_mode: ALWAYS_OFF

  # --- Sideboard Ambient (SK6812 RGBW, GPIO45) ueber SPI-DMA (SPI3) ---
  # Kurzes Kabel -> SPI-DMA laeuft hier sauber. (Langer Weg vertraegt SPI nicht,
  # daher liegt der lange Cabinet-Strip bewusst auf RMT, siehe unten.)
  - platform: spi_clockless_led
    id: light_sideboard_ambient
    output_id: sideboard_ambient_out   # Output-Objekt (RawPixelOutput) fuer Fireplace
    name: "Sideboard"
    pin: ${pin_led_sideboard}
    num_leds: ${led_sideboard_pixels}
    rgb_order: GRB
    is_rgbw: true
    spi_host: SPI3
    # 3,2 MHz -> 4-Bit-SK6812-Kodierung ergibt exakt 1,25 us/Bit (800 kbit/s).
    clock_speed: 3200000
    # Gamma-Korrektur = ESPHome-Standard (2.8). Effektwerte werden als LOGISCHE
    # Pre-Gamma-Werte geschrieben; ESPHome macht Gamma + HA-Slider-Helligkeit
    # automatisch. Kein eigenes powf / keine Slider-Multiplikation im Lambda.
    gamma_correct: 2.8
    restore_mode: RESTORE_DEFAULT_OFF
    # Effektliste ausgelagert: Basis-Effekte ohne Zonen-Effekte.
    effects: !include config/effects_sideboard.yaml
  # --- Cabinet Glass Edge (SK6812 RGBW, GPIO46) ueber RMT-DMA ---
  # Langes Kabel -> RMT hat mehr Signalreserve als der SPI-Stream und laeuft
  # damit auch ueber die lange Leitung einwandfrei (per Treiber-Tausch bestaetigt).
  # Nutzt den einzigen DMA-faehigen RMT-Kanal des S3.
  - platform: serialized_rmt_led
    id: light_cabinet_glass_edge
    output_id: cabinet_glass_edge_out   # Output-Objekt (RawPixelOutput) fuer Fireplace
    name: "Cabinet"
    pin: ${pin_led_glass_edge}
    num_leds: ${led_glass_edge_pixels}
    chipset: SK6812
    rgb_order: GRB
    is_rgbw: true
    # DMA + grosser Puffer (1024): der komplette Frame wird per DMA ausgegeben,
    # ohne ISR-Nachfuellen -> kein Abriss der letzten ~30 LEDs (Non-DMA mit
    # kleinem Puffer lief am Ende leer). Die frueher gefuerchtete GDMA-Kollision
    # mit dem Sideboard-SPI entfaellt, weil beide Strips per Token serialisiert
    # sind (nie gleichzeitiges Senden). 1024 = bewaehrter Init-Wert (4096 war zu
    # gross und liess rmt_new_tx_channel scheitern).
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    max_refresh_rate: 20ms
    # Gamma-Korrektur = ESPHome-Standard (2.8), siehe Sideboard.
    gamma_correct: 2.8
    restore_mode: RESTORE_DEFAULT_OFF
    # Effektliste ausgelagert: Basis-Effekte + zonenbasierte Cabinet-Effekte.
    effects: !include config/effects_cabinet.yaml

# =============================================================================
# LUEFTER (ECHT) -- AUTOMATISCHE Temperatur-Regelung (kein manueller Regler).
# Zieldrehzahl nach AV-Receiver-Temperatur, geschlossener Regelkreis ueber den
# Tacho (out_fan_pwm <- Regelung im interval-Block). Siehe interval: unten.
#   <= 26 C       -> 500 rpm   (leise, Lebenszeichen)
#   26..34 C      -> Zieldrehzahl linear 500 -> 1400 rpm (Regler)
#   > 34 C        -> Vollgas (100 % Duty, ohne Regler)
# =============================================================================

# =============================================================================
# TV-LIFT -- Positionssteuerung ausschliesslich ueber LiftMotor.
# Pfeile Hoch/Runter fahren immer manuell; Prozent-/Positionsziele sind erst
# nach erfolgreicher manueller Referenzierung zulaessig.
# =============================================================================
cover:
  - platform: template
    id: tv_lift
    name: "TV Lift"
    # Bewusst OHNE device_class: als "shade" behandelt Home Assistant den Lift
    # als Rollo. Die Cover-Domain kennt ohnehin nur die Zustaende geoeffnet und
    # geschlossen -- eine sprechende Lageangabe liefert der Textsensor
    # "TV Lift Lage" (Unten / Oben / Zwischenlage / Fahrtrichtung).
    icon: "mdi:television-shimmer"
    has_position: true
    optimistic: false
    # assumed_state: true ist hier fachlich richtig und loest ein UI-Problem.
    # Home Assistant sperrt bei einem Cover die Runter-Taste, sobald die
    # Position 0 meldet ("bereits geschlossen"), und die Hoch-Taste bei 100.
    # Solange der Lift nicht referenziert ist, ist die Position aber unbekannt --
    # gerade dann muss man manuell nach unten fahren koennen, um ueberhaupt
    # referenzieren zu koennen. Mit assumed_state verzichtet HA auf dieses
    # Sperren und zeigt Hoch/Stop/Runter dauerhaft bedienbar.
    assumed_state: true
    open_action:
      - lambda: 'id(lift)->start_manual(1);'
    close_action:
      - lambda: 'id(lift)->start_manual(-1);'
    position_action:
      - lambda: |-
          const int64_t span = id(lift)->max_position() - id(lift)->min_position();
          const int64_t target = id(lift)->min_position() +
                                 (int64_t) llroundf(pos * (float) span);
          id(lift)->goto_position(target);
    stop_action:
      - lambda: 'id(lift)->stop();'

# =============================================================================
# SENSOREN
# ERLEDIGT (Strom): rail_* = 2x INA226 auf gemeinsamem I2C-Bus (${ina226_*}).
# ERLEDIGT (Temp/Feuchte): av/cabinet = DS18B20 (dallas_temp), Raum = DHT22.
# ERLEDIGT (Fan): av_fan_rpm = pulse_counter (${pin_fan_tach}), PWM = out_fan_pwm.
#   Alle Namen/Einheiten unveraendert lassen!
# =============================================================================
sensor:
  # --- INA226 12V-Schiene (ECHT) ---
  # Die Hub-ID bleibt fuer gezielte Diagnose-Updates verfuegbar.
  - platform: ina226
    id: ina_12v
    address: ${ina226_12v_address}
    shunt_resistance: ${ina226_12v_shunt}
    max_current: ${ina226_12v_max_current}
    adc_time: 1100us
    adc_averaging: 128
    update_interval: 2s
    current:
      name: "Rail 12V Current"
      id: rail_12v_current
    power:
      name: "Rail 12V Power"
      id: rail_12v_power
    bus_voltage:
      name: "Rail 12V Voltage"
      id: rail_12v_voltage
    shunt_voltage:
      name: "Rail 12V Shunt Voltage"
      id: rail_12v_shunt_voltage
      entity_category: diagnostic

  # --- INA226 5V-Schiene (ECHT) ---
  - platform: ina226
    address: ${ina226_5v_address}
    shunt_resistance: ${ina226_5v_shunt}
    max_current: ${ina226_5v_max_current}
    adc_time: 1100us
    adc_averaging: 128
    update_interval: 2s
    current:
      name: "Rail 5V Current"
      id: rail_5v_current
    power:
      name: "Rail 5V Power"
      id: rail_5v_power
    bus_voltage:
      name: "Rail 5V Voltage"
      id: rail_5v_voltage
    shunt_voltage:
      name: "Rail 5V Shunt Voltage"
      id: rail_5v_shunt_voltage
      entity_category: diagnostic

  # --- Energie kumuliert pro Schiene (integriert die Leistung ueber die Zeit) ---
  - platform: total_daily_energy
    name: "Rail 12V Energy Daily"
    id: rail_12v_energy_daily
    power_id: rail_12v_power
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    state_class: total_increasing
    device_class: energy
  - platform: total_daily_energy
    name: "Rail 5V Energy Daily"
    id: rail_5v_energy_daily
    power_id: rail_5v_power
    unit_of_measurement: "Wh"
    accuracy_decimals: 1
    state_class: total_increasing
    device_class: energy

  # --- Gesamtleistung (12V + 5V) ---
  - platform: template
    name: "Rail Total Power"
    id: rail_total_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      float a = id(rail_12v_power).state;
      float b = id(rail_5v_power).state;
      if (isnan(a)) a = 0.0f;
      if (isnan(b)) b = 0.0f;
      return a + b;

  # --- Temperaturen (DS18B20, ECHT, je eigener 1-Wire-Bus) ---
  - platform: dallas_temp
    one_wire_id: onewire_av
    name: "AV Receiver Temperature"
    id: av_receiver_temperature
    update_interval: 10s
  - platform: dallas_temp
    one_wire_id: onewire_cabinet
    name: "Cabinet Temperature"
    id: cabinet_temperature
    update_interval: 10s

  # --- Raum Temp/Feuchte (DHT22, ECHT) ---
  # GPIO0 ist Strapping-/BOOT-Pin. Interner Pull-up zusaetzlich zum externen
  # aktiviert -- stabilisiert die 1-Draht-Kommunikation des DHT22 (Sensor zieht
  # die Leitung nur nach LOW, der Ruhepegel muss sicher HIGH sein).
  - platform: dht
    pin:
      number: ${pin_dht}
      mode:
        input: true
        pullup: true
    model: DHT22
    update_interval: 30s
    temperature:
      name: "Livingroom Temperature"
      id: livingroom_temperature
    humidity:
      name: "Livingroom Humidity"
      id: livingroom_humidity

  # --- Luefter-Drehzahl (ECHT, pulse_counter) ---
  # 2 Pulse/Umdrehung -> multiply 0.5 rechnet pulses/min in rpm um.
  # pullup: true nutzt den internen Pull-up (falls kein externer bestueckt).
  - platform: pulse_counter
    name: "AV Fan RPM"
    id: av_fan_rpm
    pin:
      number: ${pin_fan_tach}
      mode:
        input: true
        pullup: true
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - multiply: 0.5

  # --- Luefter-Duty (Diagnose, von der Temperatur-Regelung gestellt) ---
  - platform: template
    name: "AV Fan Duty"
    id: av_fan_duty
    unit_of_measurement: "%"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: 'return id(fan_duty) * 100.0f;'

  # --- System-Diagnose ---
  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    entity_category: diagnostic
    update_interval: 30s
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    entity_category: diagnostic
    update_interval: 30s
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

  # --- Motor-Encoder (PCNT Hardware-Zaehler) ---
  # GPIO16/GPIO18 bleiben reine Eingaenge ohne interne Pull-Widerstaende.
  # x4 und 10-us-Filter bleiben aktiv; invert_direction wird erst nach einem
  # beaufsichtigten Richtungstest bei Bedarf geaendert.
  # Der rohe PCNT-Zaehler bleibt intern fuer LiftMotor erhalten, wird aber nicht
  # mehr als eigene HA-Entitaet publiziert. Seit dem Offset-Umbau ist dieser
  # bootrelative Rohwert absichtlich nicht die Liftposition und kann negativ
  # sein. Der Regeltask liest ihn direkt; ein zusaetzliches 250-ms-Polling im
  # Mainloop ist unnoetig.
  - platform: pcnt_quadrature
    id: motor_encoder
    internal: true
    pin_a:
      number: ${pin_encoder_a}
      mode:
        input: true
    pin_b:
      number: ${pin_encoder_b}
      mode:
        input: true
    resolution: 4
    internal_filter: 10us
    # Messung am Aufbau: ohne Invertierung zaehlte Aufwaerts negativ. Gewuenscht
    # ist positiv = hoch/offen, 0 = unten/geschlossen -- daher invertiert.
    invert_direction: true
    update_interval: never

  # --- Lift-Position (echt, aus PCNT-Encoder) ---
  # Die Umrechnung Counts -> mm folgt dem Uebersetzungsverhaeltnis aus
  # config/hardware.yaml (Encoder-Counts je Motorumdrehung, Getriebe,
  # Gewindesteigung) und NICHT einer geschaetzten Hublaenge:
  #   12 Counts/Motorumdrehung x 48 = 576 Counts/Spindelumdrehung
  #   576 / 4 mm Steigung           = 144 Counts/mm  (1 Count = 6,94 um)
  - platform: template
    name: "TV Lift Position Pulses"
    id: tv_lift_position_pulses
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 500ms
    # Referenzierte Position vom Regler, NICHT der bootrelative PCNT-Rohwert:
    # Der Nullpunkt liegt seit dem Offset-Umbau in LiftMotor.
    lambda: 'return (float) id(lift)->position();'
  - platform: template
    name: "TV Lift Position mm"
    id: tv_lift_position_mm
    unit_of_measurement: "mm"
    icon: "mdi:ruler"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 500ms
    lambda: |-
      // Counts/mm aus dem Antriebsstrang ableiten, damit nur noch Getriebe und
      // Steigung gepflegt werden muessen.
      constexpr float counts_per_mm =
          ((float) ${lift_encoder_counts_per_motor_rev} * (float) ${lift_gear_ratio}) /
          (float) ${lift_screw_lead_mm};
      // Referenzierte Position vom Regler, nicht der Encoder-Rohwert.
      return (float) id(lift)->position() / counts_per_mm;
  # --- Lift-Geschwindigkeit (Diagnose der Geschwindigkeitsregelung) ---
  # Gefilterte Encodergeschwindigkeit in Counts/s, vorzeichenbehaftet
  # (positiv = Aufwaerts/Oeffnen). 288 Counts/mm -> 288 Counts/s = 1 mm/s.
  # Referenz fuer die Kalibrierung: 100 Prozent Duty ~ 1400 Counts/s.
  - platform: template
    name: "Lift Geschwindigkeit"
    id: lift_speed_counts
    unit_of_measurement: "counts/s"
    icon: "mdi:speedometer"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 200ms
    lambda: 'return id(lift)->speed();'

  # Signiertes Regler-Duty: positiv = aufwaerts, negativ = abwaerts.
  # Zusammen mit Soll-/Istgeschwindigkeit zeigt dieser Wert, ob das beobachtete
  # Stop-and-go vom PI-Clamping (Duty 0 bei weiterhin MOVING) stammt.
  - platform: template
    name: "Lift Duty"
    id: lift_duty
    unit_of_measurement: "%"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 200ms
    lambda: 'return id(lift)->duty() * 100.0f;'

  - platform: template
    name: "Lift Sollgeschwindigkeit"
    id: lift_speed_command
    unit_of_measurement: "counts/s"
    icon: "mdi:speedometer-slow"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 200ms
    lambda: 'return id(lift)->speed_command();'

  # Lebenszeichen des 1-ms-Regeltasks. Entscheidend fuer die Unterscheidung
  # zweier sonst gleich aussehender Fehlerbilder: Stehen die Zyklen still,
  # waehrend die Position einfriert, hing der Regeltask selbst (z. B. Flash-Cache
  # aus). Laufen die Zyklen weiter und die Position bleibt trotzdem stehen, liegt
  # es an der Encoder-Auswertung. Ersetzt bewusst die frueher entfernte rohe
  # Encoderentitaet -- der PCNT-Rohwert bleibt intern.
  - platform: template
    name: "Lift Regelzyklen"
    id: lift_control_cycles
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return (float) id(lift)->cycles();'

  - platform: template
    name: "Lift Taktausreisser"
    id: lift_control_overruns
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return (float) id(lift)->overruns();'

  - platform: template
    name: "TV Lift Position Percent"
    id: tv_lift_position_percent
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(lift)->homed()) return NAN;
      const float pos = (float) id(lift)->position();
      const float span = (float) (id(lift)->max_position() - id(lift)->min_position());
      if (span <= 0.0f) return NAN;
      float pct = (pos - (float) id(lift)->min_position()) / span * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

binary_sensor:

  # --- Ueberstrom-Warnung je Schiene (Schwellen in config/hardware.yaml) ---
  - platform: template
    name: "Rail 12V Overcurrent"
    id: rail_12v_overcurrent
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const float c = id(rail_12v_current).state;
      if (isnan(c)) return false;
      return c > ${ina226_12v_warn_current}f;
  - platform: template
    name: "Rail 5V Overcurrent"
    id: rail_5v_overcurrent
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const float c = id(rail_5v_current).state;
      if (isnan(c)) return false;
      return c > ${ina226_5v_warn_current}f;

  # API-Verbindungsstatus (Home Assistant erreichbar?)
  - platform: status
    name: "API Connected"
    id: sys_api_connected
    entity_category: diagnostic

text_sensor:
  # Sprechende Lageangabe. Ersetzt in der Oberflaeche das nichtssagende
  # "geoeffnet/geschlossen" der Cover-Domain.
  - platform: template
    name: "TV Lift Lage"
    id: tv_lift_position_text
    icon: "mdi:arrow-up-down"
    update_interval: 1s
    lambda: |-
      if (!id(lift)->homed())
        return {"Nicht referenziert"};

      const int direction = id(lift)->motion_direction();
      if (id(lift)->busy() && direction > 0)
        return {"Faehrt hoch"};
      if (id(lift)->busy() && direction < 0)
        return {"Faehrt runter"};

      const float pos = (float) id(lift)->position();
      const float top = (float) id(lift)->max_position();
      if (top <= 0.0f)
        return {"Unbekannt"};
      // Endlagenfenster rund 2 mm (etwa 250 Counts bei 144 Counts/mm).
      if (pos <= 250.0f)
        return {"Unten"};
      if (pos >= top - 250.0f)
        return {"Oben"};

      char buffer[32];
      snprintf(buffer, sizeof(buffer), "Zwischenlage %.0f %%", 100.0f * pos / top);
      return {buffer};

  - platform: template
    name: "Lift Zustand"
    id: lift_state
    entity_category: diagnostic
    update_interval: 200ms
    lambda: 'return {id(lift)->state_name()};'
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

button:
  # Neustart per HA (u. a. um den 1-Wire-Bus neu zu scannen).
  - platform: restart
    name: "Controller Restart"
    id: controller_restart


switch:
  # --- Referenz: EIN Schalter fuer setzen, anzeigen und verwerfen ---
  # Der Schalterzustand IST der Referenzstatus (kein separater Binaersensor).
  #   EINSCHALTEN = "untere Endlage erreicht": stoppt den Antrieb, wartet den
  #                 Stillstand ab und setzt die Position auf 0. Danach sind die
  #                 Softlimits 0..${lift_top_position_pulses} aktiv und der
  #                 Positions-Slider ist freigegeben.
  #   AUSSCHALTEN = Referenz verwerfen, z. B. nach Handverstellung im
  #                 spannungslosen Zustand. Positionsfahrten sind dann gesperrt,
  #                 die manuellen Pfeile bleiben nutzbar.
  # Die Referenz liegt im NVS und uebersteht einen Stromausfall.
  - platform: template
    name: "Lift Referenz"
    id: lift_reference_switch
    icon: "mdi:crosshairs-gps"
    # Diagnose-Kategorie: im Alltag wird der Lift ueber das Cover bedient, der
    # Referenzschalter ist ein Einrichtungs-/Servicebedienelement.
    entity_category: diagnostic
    # Während der 800-ms-Stillstandsprüfung bereits EIN anzeigen. Nach Erfolg
    # bleibt homed=true; bei einem Fehler wird reference_pending verworfen.
    lambda: 'return id(lift)->homed() || id(lift)->reference_pending();'
    turn_on_action:
      - script.execute: lift_set_reference_here
    turn_off_action:
      - script.stop: lift_set_reference_here
      - lambda: 'id(lift)->clear_reference();'

select:
  - platform: template
    name: "Livingroom Light Scene"
    id: livingroom_light_scene
    optimistic: true
    # Echte Raum-Szenen statt Effektnamen einzelner Strips. Die Kalibrierbilder
    # ("Fireplace Palette (Kalibrierung)") sind bewusst NICHT enthalten, sie
    # bleiben je Licht direkt waehlbar.
    options:
      - Manual
      - Aus
      - Kaminfeuer
      - Vitrine
      - Kaminfeuer + Vitrine
      - Cinema
      - Feuerwerk
    initial_option: Manual
    # Ueberlebt Stromausfall und Neustart; initial_option gilt nur beim
    # allerersten Start bzw. nach einem Loeschen des NVS.
    restore_value: true
    on_value:
      - script.execute: apply_light_scene

number:
  # Marschgeschwindigkeit zur Laufzeit. Fuer die Umdrehungsmessung klein
  # einstellen (z. B. 150 Counts/s), damit sich die Welle langsam dreht und
  # genau eine Umdrehung getroffen werden kann. Danach wieder hochsetzen.
  - platform: template
    name: "Lift Max Geschwindigkeit"
    id: lift_max_speed_number
    entity_category: config
    optimistic: true
    min_value: 50
    max_value: 2400
    step: 50
    initial_value: 1500
    # Eingestellte Marschgeschwindigkeit bleibt ueber Stromausfall erhalten und
    # wird beim Start per on_value erneut an den Regler uebergeben.
    restore_value: true
    unit_of_measurement: "counts/s"
    mode: box
    on_value:
      - lambda: |-
          id(lift)->set_max_speed(x);
          ESP_LOGI("lift", "Marschgeschwindigkeit auf %.0f Counts/s gesetzt", x);

  - platform: template
    name: "Livingroom Effect Intensity"
    id: livingroom_effect_intensity
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60
    # Zuletzt eingestellte Intensitaet bleibt nach Stromausfall erhalten.
    restore_value: true
    on_value:
      - script.execute: apply_light_scene
  # Hinweis: Ein frueherer "Livingroom Effect Speed"-Regler wurde entfernt. Der
  # Fireplace-Flicker laeuft in einem physikalisch motivierten festen Frequenz-
  # band (~9-13 Hz) im C++-Effekt und wurde nie an einen Speed-Wert gebunden;
  # ein 0-100-Regler waere daher funktionslos/irrefuehrend gewesen.


# =============================================================================
# SZENEN-ENGINE
# Setzt Farbe/Weiss/Helligkeit + ESPHome-Effekt aller drei Lichter je nach
# ausgewaehlter "Livingroom Light Scene". Intensity steuert die Helligkeit.
# TODO HARDWARE (LED): Bei adressierbaren Strips hier zusaetzlich Speed und
# per-Pixel-Effekte nutzen (addressable_lambda).
# =============================================================================
script:
  # ---------------------------------------------------------------------------
  # REFERENZIEREN mit einer Taste.
  # Der Antrieb wird zuerst sicher stillgesetzt, danach wird der Stillstand
  # abgewartet (der Regler verlangt eine ruhige Encoderposition, damit kein
  # Auslauf mitgenommen wird) und erst dann die Position auf 0 gesetzt.
  # ---------------------------------------------------------------------------
  - id: lift_set_reference_here
    mode: single
    then:
      # Setzt reference_pending sofort, damit der Schalter waehrend der
      # Stillstandswartezeit nicht optisch zurueckspringt. Der Motor wird dabei
      # bereits sicher gestoppt.
      - lambda: |-
          if (!id(lift)->prepare_reference())
            ESP_LOGE("lift", "Referenzvorbereitung fehlgeschlagen.");
      # Auslauf und Stillstandspruefung des Reglers abwarten (>= 250 ms).
      - delay: 800ms
      - lambda: |-
          if (id(lift)->set_reference(0)) {
            ESP_LOGI("lift", "Referenz gesetzt: untere Endlage = 0, Softlimits 0..%lld aktiv.",
                     (long long) id(lift)->max_position());
          } else {
            id(lift)->clear_reference();
            ESP_LOGE("lift", "Referenz NICHT gesetzt -- Meldung oben pruefen (Lift muss stehen).");
          }

  # LED-Verdrahtungs-Selbsttest. Ablauf (beide Strips):
  #  1) Nur Sideboard rot / nur Glass Edge rot -> Pin-Zuordnung, nicht vertauscht
  #  2) R -> G -> B -> W auf beiden -> Farbreihenfolge (GRB) + RGBW-Weisskanal
  #  3) Pixel Walk -> LED-Anzahl, Laufrichtung, tote Pixel
  - id: led_wiring_test
    mode: restart
    then:
      # 1) Pin-Zuordnung
      - light.turn_off: light_cabinet_glass_edge
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
          effect: "None"
      - delay: 2s
      - light.turn_off: light_sideboard_ambient
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
          effect: "None"
      - delay: 2s
      # 2) Farbreihenfolge + RGBW (beide gleichzeitig): ROT
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          white: 0%
      - delay: 1500ms
      # GRUEN
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 100%
          blue: 0%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 100%
          blue: 0%
          white: 0%
      - delay: 1500ms
      # BLAU
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 0%
          blue: 100%
          white: 0%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 0%
          blue: 100%
          white: 0%
      - delay: 1500ms
      # WEISS (nur W-Kanal)
      - light.turn_on:
          id: light_sideboard_ambient
          red: 0%
          green: 0%
          blue: 0%
          white: 100%
      - light.turn_on:
          id: light_cabinet_glass_edge
          red: 0%
          green: 0%
          blue: 0%
          white: 100%
      - delay: 2s
      # 3) Pixel Walk (Anzahl / Richtung / tote Pixel)
      - light.turn_on:
          id: light_sideboard_ambient
          brightness: 100%
          effect: "None"
      - light.turn_on:
          id: light_cabinet_glass_edge
          brightness: 100%
          effect: "None"

  - id: apply_light_scene
    then:
      - lambda: |-
          auto set_light = [](light::LightState *l, float r, float g, float b,
                              float w, float bri, const char *eff) {
            // Intensitaet 0 bedeutet wirklich AUS (keine 2 %-Resthelligkeit,
            // sonst leuchten Effekte mit Grundanteil weiter schwach).
            if (bri <= 0.0f) {
              l->turn_off().perform();
              return;
            }
            auto call = l->turn_on();
            call.set_rgb(r, g, b);
            call.set_white(w);
            call.set_brightness(bri);
            call.set_effect(eff);
            call.perform();
          };
          auto clear_eff = [](light::LightState *l) {
            if (l->remote_values.is_on()) {
              auto call = l->turn_on();
              call.set_effect("None");
              call.perform();
            }
          };
          const auto s = id(livingroom_light_scene).current_option();
          const float bri = id(livingroom_effect_intensity).state / 100.0f;
          if (s == "Manual") {
            // Kein Eingriff: die Lichter behalten ihren Einzelzustand.
            clear_eff(id(light_sideboard_ambient));
            clear_eff(id(light_cabinet_glass_edge));
          } else if (s == "Aus") {
            id(light_sideboard_ambient)->turn_off().perform();
            id(light_cabinet_glass_edge)->turn_off().perform();
          } else if (s == "Kaminfeuer") {
            // Beide Strips mit dem Raw-Kaminfeuer; HA-Slider (bri) steuert die
            // Helligkeit ueber current_values im Effekt selbst.
            set_light(id(light_sideboard_ambient), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace");
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace");
          } else if (s == "Vitrine") {
            // Nur das Cabinet zeigt den Vitrinen-Look, das Sideboard bleibt aus.
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.45f, 0.0f, 1.0f, bri, "Museum");
            id(light_sideboard_ambient)->turn_off().perform();
          } else if (s == "Kaminfeuer + Vitrine") {
            set_light(id(light_sideboard_ambient), 1.0f, 0.3f, 0.0f, 0.0f, bri, "Fireplace");
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.45f, 0.0f, 1.0f, bri, "Museum");
          } else if (s == "Cinema") {
            // Filmbetrieb: am Sideboard bewusst KEIN Flackern, sondern das
            // statische Parabelprofil -- der Strip sitzt direkt unter dem
            // Bildschirm. Das Cabinet bleibt auf dem ruhigen Museum-Look.
            set_light(id(light_sideboard_ambient), 1.0f, 0.35f, 0.0f, 1.0f, bri, "Cinema");
            set_light(id(light_cabinet_glass_edge), 1.0f, 0.45f, 0.0f, 1.0f, bri, "Museum");
          } else if (s == "Feuerwerk") {
            set_light(id(light_sideboard_ambient), 1.0f, 1.0f, 1.0f, 0.0f, bri, "Fireworks");
            set_light(id(light_cabinet_glass_edge), 1.0f, 1.0f, 1.0f, 0.0f, bri, "Fireworks");
          }

interval:
  # Gemeinsamer sicherer Preferences-Sync fuer Licht, Szene, Reglerwerte,
  # Energiezaehler und sonstige ESPHome-Zustaende. Waehrend einer Liftfahrt
  # wird nicht synchronisiert; der naechste 5-s-Takt holt es im Stillstand nach.
  # Ein Aufruf ohne vorgemerkte Aenderungen schreibt laut ESP32-Backend nichts.
  - interval: 5s
    then:
      - lambda: |-
          if (!id(lift)->busy())
            id(lift)->sync_preferences_safely();

  # Cover-Status aktualisieren. Publiziert wird nur bei echter Aenderung (plus
  # ein Lebenszeichen alle 5 s), nicht 5x pro Sekunde -- das sparte sonst
  # weder API-Bandbreite noch beruhigte es die Oberflaeche.
  - interval: 200ms
    then:
      - lambda: |-
          static float last_position = -1.0f;
          static cover::CoverOperation last_operation = cover::COVER_OPERATION_IDLE;
          static uint32_t last_publish_ms = 0;
          const uint8_t lift_state = id(lift)->state();
          if ((lift_state == esphome::lift_motor::LIFT_MOVING ||
               lift_state == esphome::lift_motor::LIFT_MANUAL) && id(lift)->busy()) {
            const int direction = id(lift)->motion_direction();
            if (direction > 0) {
              id(tv_lift).current_operation = cover::COVER_OPERATION_OPENING;
            } else if (direction < 0) {
              id(tv_lift).current_operation = cover::COVER_OPERATION_CLOSING;
            } else {
              id(tv_lift).current_operation = cover::COVER_OPERATION_IDLE;
            }
          } else {
            id(tv_lift).current_operation = cover::COVER_OPERATION_IDLE;
          }

          if (id(lift)->homed()) {
            const float min_pos = (float) id(lift)->min_position();
            const float span = (float) (id(lift)->max_position() - id(lift)->min_position());
            if (span > 0.0f) {
              float position = ((float) id(lift)->position() - min_pos) / span;
              if (position < 0.0f) position = 0.0f;
              if (position > 1.0f) position = 1.0f;
              id(tv_lift).position = position;
            }
          } else {
            // Nicht referenziert: die absolute Position ist unbekannt.
            // NAN ist keine Option -- damit graut Home Assistant die komplette
            // Cover-Steuerung aus, und dann kaeme man nicht mehr nach unten zur
            // Referenzlage. Gemeldet wird deshalb 0 (= geschlossen): Das ist der
            // Zustand, in dem referenziert wird, also die einzige Annahme, die
            // nach dem Referenzieren sofort stimmt. Frueher standen hier 50 %,
            // was HA faelschlich als "Geoeffnet" anzeigte.
            // Die Tasten bleiben trotz 0 bedienbar, weil das Cover
            // assumed_state: true gesetzt hat.
            // Die Wahrheit steht in "TV Lift Lage" ("Nicht referenziert") und im
            // Prozent-Sensor, der bis zur Referenzierung unbekannt bleibt.
            id(tv_lift).position = cover::COVER_CLOSED;
          }

          // Nur bei Aenderung senden; zusaetzlich alle 5 s ein Lebenszeichen,
          // damit die Oberflaeche nach einem Neuverbinden sicher stimmt.
          const uint32_t now = millis();
          const bool position_changed = fabsf(id(tv_lift).position - last_position) >= 0.005f;
          const bool operation_changed = id(tv_lift).current_operation != last_operation;
          if (position_changed || operation_changed || (now - last_publish_ms) >= 5000) {
            last_position = id(tv_lift).position;
            last_operation = id(tv_lift).current_operation;
            last_publish_ms = now;
            id(tv_lift).publish_state(false);
          }

  # Luefter-Temperatur-Regelung (jede Sekunde), lineare Kennlinie:
  #   <= 26 C -> 500 rpm, 26..34 C -> linear bis 1400 rpm (Regler),
  #   > 34 C -> Vollgas (100 % Duty, ohne Regler; 0,5 C Hysterese).
  - interval: 1s
    then:
      - lambda: |-
          static bool full = false;
          const float t = id(av_receiver_temperature).state;   // kann NaN sein
          if (!isnan(t)) {
            if (t >= 34.0f) full = true;
            else if (t < 33.5f) full = false;
          }

          float duty = id(fan_duty);
          if (full) {
            duty = 1.0f;                         // Vollgas ohne Regler
          } else {
            // Zieldrehzahl linear zwischen 26 C/500 rpm und 34 C/1400 rpm.
            float target;
            if (isnan(t)) {
              target = 500.0f;                   // Fallback ohne Temp-Wert
            } else {
              float tc = t;
              if (tc < 26.0f) tc = 26.0f;
              if (tc > 34.0f) tc = 34.0f;
              target = 500.0f + (tc - 26.0f) / (34.0f - 26.0f) * (1400.0f - 500.0f);
            }
            const float rpm = id(av_fan_rpm).state;
            if (isnan(rpm) || rpm < 100.0f) {
              duty = fmaxf(duty, 0.45f);         // Anlauf-Kick, falls Luefter steht
            } else {
              duty += 0.00015f * (target - rpm); // Integralregler auf Ziel-RPM
            }
            if (duty < 0.10f) duty = 0.10f;      // Mindest-Duty (dreht noch)
            if (duty > 1.0f)  duty = 1.0f;
          }
          id(fan_duty) = duty;
          id(out_fan_pwm).set_level(duty);
