# Vorlage. Kopieren nach secrets.yaml und ausfuellen -- secrets.yaml ist
# absichtlich nicht im Git.

# --- ESPHome-Controller ---------------------------------------------------
# Beide Werte stehen im ESPHome-Dashboard beim Geraet beziehungsweise wurden
# beim Anlegen erzeugt.
wohnzimmer_api_key: "REPLACE_WITH_ESPHOME_API_KEY"
wohnzimmer_ota_password: "REPLACE_WITH_OTA_PASSWORD"

# --- Home-Assistant-Pipeline (tools/ha.py) --------------------------------
# Alle Schluessel mit dem Praefix ha_ bleiben auf diesem Rechner: beim Ausrollen
# nach /config/esphome werden sie aus der uebertragenen secrets.yaml entfernt.
#
# ha_host: feste IP-Adresse des Home-Assistant-Hosts. Der Name
#   homeassistant.local funktioniert oft, loest unter Windows aber gern auf eine
#   link-local IPv6-Adresse auf -- die IP-Adresse ist der verlaesslichere Weg.
ha_host: "192.168.1.10"

# ha_token: langlebiges Zugriffs-Token -- NICHT das Passwort des Benutzers.
#   Es ist ein eigener, sehr langer String (JWT, rund 180 Zeichen, beginnt mit
#   "eyJ"). Erzeugen als der Benutzer, der die Automatisierung ausfuehren soll:
#   in Home Assistant unten links auf den Benutzernamen -> Sicherheit -> ganz
#   unten Langlebige Zugriffs-Tokens -> Token erstellen. Wird nur einmal
#   angezeigt, jederzeit an derselben Stelle widerrufbar.
ha_token: "REPLACE_WITH_LONG_LIVED_ACCESS_TOKEN"

# ha_ssh_key: privater Schluessel fuer das Add-on "Advanced SSH & Web Terminal".
#   Anlegen mit: python tools/ha.py keygen
ha_ssh_key: "~/.ssh/ha_livingroom"

# Vorgaben, nur bei abweichendem Aufbau aendern:
# ha_port: 8123
# ha_scheme: "http"
# ha_ssh_user: "root"
# ha_ssh_port: 22
# ha_config_dir: "/config"
