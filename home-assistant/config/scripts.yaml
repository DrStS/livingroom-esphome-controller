# Kino-Modus: Toggle. Erster Druck speichert den aktuellen Zustand und wechselt
# auf Kino (Lift 18 %, Cinema, 35 %). Zweiter Druck stellt den vorherigen
# Zustand wieder her.
wohnzimmer_kino:
  alias: "Wohnzimmer Kino"
  icon: mdi:movie-open
  description: "Toggle: Kino ein/aus mit Zustandswiederherstellung"
  sequence:
    - choose:
        # Kino ist AUS -> einschalten
        - conditions:
            - condition: state
              entity_id: input_boolean.wohnzimmer_kino_aktiv
              state: "off"
          sequence:
            # Aktuellen Zustand merken
            - action: input_number.set_value
              target:
                entity_id: input_number.wohnzimmer_kino_prev_position
              data:
                value: "{{ state_attr('cover.wohnzimmer_controller_tv_lift', 'current_position') | float(0) }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.wohnzimmer_kino_prev_scene
              data:
                value: "{{ states('select.wohnzimmer_controller_livingroom_light_scene') }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.wohnzimmer_kino_prev_intensity
              data:
                value: "{{ states('number.wohnzimmer_controller_livingroom_effect_intensity') | float(60) }}"
            # Kino-Zustand setzen
            - action: select.select_option
              target:
                entity_id: select.wohnzimmer_controller_livingroom_light_scene
              data:
                option: "Cinema"
            - action: number.set_value
              target:
                entity_id: number.wohnzimmer_controller_livingroom_effect_intensity
              data:
                value: 35
            - action: cover.set_cover_position
              target:
                entity_id: cover.wohnzimmer_controller_tv_lift
              data:
                position: 18
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.wohnzimmer_kino_aktiv
      # Kino ist EIN -> ausschalten, vorherigen Zustand wiederherstellen
      default:
        - action: select.select_option
          target:
            entity_id: select.wohnzimmer_controller_livingroom_light_scene
          data:
            option: "{{ states('input_text.wohnzimmer_kino_prev_scene') }}"
        - action: number.set_value
          target:
            entity_id: number.wohnzimmer_controller_livingroom_effect_intensity
          data:
            value: "{{ states('input_number.wohnzimmer_kino_prev_intensity') | float(60) }}"
        - action: cover.set_cover_position
          target:
            entity_id: cover.wohnzimmer_controller_tv_lift
          data:
            position: "{{ states('input_number.wohnzimmer_kino_prev_position') | int(0) }}"
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.wohnzimmer_kino_aktiv
  mode: single
