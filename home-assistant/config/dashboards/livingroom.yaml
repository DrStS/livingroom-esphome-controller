# =============================================================================
# LIVING ROOM DASHBOARD
# -----------------------------------------------------------------------------
# Alle Entitaets-IDs sind gegen das laufende Geraet geprueft (ESPHome-API).
#
# Aufbau in drei Ansichten, damit die Uebersicht kompakt bleibt:
#   Uebersicht -> Bedienung und aktuelle Werte, keine Graphen
#   Verlauf    -> alle Liniengraphen
#   Diagnose   -> Service, Referenzieren, Systemwerte
#
# Entfernt gegenueber der alten Version:
#   - input_select.livingroom_mode und script.livingroom_set_mode
#     (das HA-Package war defekt und ist geloescht; die Szenen-Auswahl am ESP
#      erfuellt dieselbe Aufgabe und funktioniert auch ohne Home Assistant)
#   - tv_lift_homed, tv_lift_fault, tv_lift_reference, tv_lift_clear_fault
#     (existieren in der aktuellen Firmware nicht mehr)
#
# Lift-Bedienung: Pfeile fahren manuell, der Positions-Slider faehrt ein Ziel an
# (nur nach Referenzierung). Referenziert wird ueber den Schalter in Diagnose.
# =============================================================================
title: Living Room
views:
  # ===========================================================================
  - title: Uebersicht
    path: overview
    icon: mdi:sofa
    cards:
      - type: tile
        entity: cover.wohnzimmer_controller_tv_lift
        name: TV Lift
        features:
          - type: cover-open-close
          - type: cover-position

      # "Lage" statt des Cover-Zustands: die Cover-Domain in Home Assistant
      # kennt nur geoeffnet/geschlossen. Hier steht Unten, Oben, Zwischenlage
      # mit Prozentwert oder die aktuelle Fahrtrichtung.
      - type: entities
        title: TV Lift
        show_header_toggle: false
        entities:
          - entity: sensor.wohnzimmer_controller_tv_lift_lage
            name: Lage
          - entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position
          - entity: sensor.wohnzimmer_controller_tv_lift_position_mm
            name: Position (mm)

      # Bewusst KEINE Gauge-Karte: solange der Lift nicht referenziert ist, ist
      # der Prozentwert unbekannt, und eine Gauge quittiert das mit
      # "Entitaet ist nicht-numerisch". Tiles zeigen "Unbekannt" sauber an.
      - type: tile
        entity: sensor.wohnzimmer_controller_tv_lift_lage
        name: Lift Lage
      - type: tile
        entity: sensor.wohnzimmer_controller_tv_lift_position_percent
        name: Lift Position

      # Szenen: Kaminfeuer flackert bewusst. Cinema laesst das Sideboard
      # ruhig (statisches Parabelprofil), weil es direkt unter dem Bildschirm
      # sitzt; das Cabinet bleibt dabei auf dem Museum-Look.
      - type: entities
        title: Licht
        entities:
          - entity: light.wohnzimmer_controller_sideboard
          - entity: light.wohnzimmer_controller_cabinet
          - type: divider
          - entity: select.wohnzimmer_controller_livingroom_light_scene
            name: Szene
          - entity: number.wohnzimmer_controller_livingroom_effect_intensity
            name: Intensitaet

      - type: entities
        title: Raum und Leistung
        show_header_toggle: false
        entities:
          - entity: sensor.wohnzimmer_controller_livingroom_temperature
            name: Raum Temperatur
          - entity: sensor.wohnzimmer_controller_livingroom_humidity
            name: Luftfeuchte
          - entity: sensor.wohnzimmer_controller_av_receiver_temperature
            name: AV Receiver
          - entity: sensor.wohnzimmer_controller_cabinet_temperature
            name: Cabinet
          - entity: sensor.wohnzimmer_controller_av_fan_rpm
            name: Luefter Drehzahl
          - type: divider
          - entity: sensor.wohnzimmer_controller_rail_total_power
            name: Leistung gesamt
          - entity: sensor.wohnzimmer_controller_rail_12v_energy_daily
            name: 12V Energie heute
          - entity: sensor.wohnzimmer_controller_rail_5v_energy_daily
            name: 5V Energie heute

  # ===========================================================================
  - title: Verlauf
    path: verlauf
    icon: mdi:chart-line
    cards:
      - type: grid
        title: TV Lift
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_tv_lift_position_mm
            name: Hub (mm)
            graph: line
            hours_to_show: 6

      - type: history-graph
        title: TV Lift Position 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position in Prozent

      - type: grid
        title: Klima und Luefter
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.wohnzimmer_controller_av_receiver_temperature
            name: AV Receiver
            graph: line
            hours_to_show: 12
          - type: sensor
            entity: sensor.wohnzimmer_controller_cabinet_temperature
            name: Cabinet
            graph: line
            hours_to_show: 12
          - type: sensor
            entity: sensor.wohnzimmer_controller_livingroom_temperature
            name: Raum Temperatur
            graph: line
            hours_to_show: 12
          - type: sensor
            entity: sensor.wohnzimmer_controller_livingroom_humidity
            name: Luftfeuchte
            graph: line
            hours_to_show: 12
          - type: sensor
            entity: sensor.wohnzimmer_controller_av_fan_rpm
            name: Luefter Drehzahl
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_av_fan_duty
            name: Luefter Duty
            graph: line
            hours_to_show: 6

      - type: grid
        title: Leistung und Strom
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_12v_power
            name: 12V Leistung
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_12v_current
            name: 12V Strom
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_12v_voltage
            name: 12V Spannung
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_5v_power
            name: 5V Leistung
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_5v_current
            name: 5V Strom
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_rail_5v_voltage
            name: 5V Spannung
            graph: line
            hours_to_show: 6

  # ===========================================================================
  - title: Diagnose
    path: diagnose
    icon: mdi:stethoscope
    cards:
      # Referenzieren: Schalter EIN, wenn der Lift auf der unteren Endlage
      # steht. AUS verwirft die Referenz (z. B. nach Handverstellung ohne Strom).
      - type: entities
        title: Lift Service
        show_header_toggle: false
        entities:
          - entity: switch.wohnzimmer_controller_lift_referenz
            name: Referenz (Ein = untere Endlage erreicht)
          - entity: sensor.wohnzimmer_controller_lift_zustand
            name: Reglerzustand
          - type: divider
          - entity: sensor.wohnzimmer_controller_lift_geschwindigkeit
            name: Geschwindigkeit
          - entity: number.wohnzimmer_controller_lift_max_geschwindigkeit
            name: Max Geschwindigkeit
          - entity: sensor.wohnzimmer_controller_tv_lift_position_pulses
            name: Position in Pulsen
          - entity: sensor.wohnzimmer_controller_motor_encoder_position
            name: Encoder absolut

      - type: entities
        title: System
        show_header_toggle: false
        entities:
          - entity: binary_sensor.wohnzimmer_controller_api_connected
            name: API verbunden
          - entity: binary_sensor.wohnzimmer_controller_rail_12v_overcurrent
            name: 12V Ueberstrom
          - entity: binary_sensor.wohnzimmer_controller_rail_5v_overcurrent
            name: 5V Ueberstrom
          - type: divider
          - entity: sensor.wohnzimmer_controller_uptime
            name: Laufzeit
          - entity: sensor.wohnzimmer_controller_esp_temperature
            name: ESP Temperatur
          - entity: sensor.wohnzimmer_controller_heap_free
            name: Freier Heap
          - entity: sensor.wohnzimmer_controller_loop_time
            name: Loop-Zeit
          - entity: sensor.wohnzimmer_controller_av_fan_duty
            name: Luefter Duty
          - type: divider
          - entity: sensor.wohnzimmer_controller_ip_address
            name: IP-Adresse
          - entity: sensor.wohnzimmer_controller_mac_address
            name: MAC-Adresse
          - entity: button.wohnzimmer_controller_controller_restart
            name: Controller neu starten
