# =============================================================================
# WOHNZIMMER -- Dashboard
# -----------------------------------------------------------------------------
# Quelle der Wahrheit. Ausgerollt mit:
#     python tools/ha.py deploy
# Nicht auf dem Host bearbeiten, der naechste Deploy ueberschreibt es.
#
# AUFBAU: drei Ansichten mit klarer Aufgabenteilung, damit nichts doppelt
# erscheint.
#   Uebersicht  Bedienen und aktuelle Werte. Keine Graphen, keine Diagnose.
#   Verlauf     Ausschliesslich Zeitverlaeufe.
#   Diagnose    Service, Regler, Messtechnik, System.
#
# Alle 40 aktiven Entitaeten des Controllers sind untergebracht. Die interne
# rohe PCNT-Entitaet wird absichtlich nicht nach Home Assistant exportiert.
# Geprueft
# mit:
#     python tools/ha.py verify                  (Referenzen -> Registry)
#     python tools/verify_dashboard_entities.py  (Referenzen -> Geraet)
#
# ZWEI ENTSCHEIDUNGEN, DIE ERKLAERUNG BRAUCHEN:
#
# 1. Keine Gauge-Karte fuer die Liftposition. Solange der Lift nicht
#    referenziert ist, hat der Prozentwert keinen Zahlenwert, und eine Gauge
#    quittiert das mit "Entitaet ist nicht-numerisch". Tile-Karten zeigen
#    "Unbekannt" sauber an.
#
# 2. Der Zustand des Covers ("geoeffnet"/"geschlossen") wird nirgends gezeigt.
#    Die Cover-Domain von Home Assistant kennt nur diese beiden Begriffe, was
#    bei einem Lift in Zwischenlage irrefuehrend ist. Stattdessen der Textwert
#    "TV Lift Lage": Unten, Oben, Zwischenlage mit Prozent, Faehrt hoch,
#    Faehrt runter, Nicht referenziert.
# =============================================================================
title: Wohnzimmer
views:
  # ===========================================================================
  # ÜBERSICHT
  # ===========================================================================
  - title: Übersicht
    path: overview
    icon: mdi:sofa
    type: sections
    max_columns: 3
    sections:
      # -- TV Lift -----------------------------------------------------------
      # Die Pfeile fahren manuell und funktionieren auch ohne Referenz. Der
      # Positionsschieber faehrt ein Ziel an und braucht dafuer die Referenz.
      - type: grid
        cards:
          - type: heading
            heading: TV Lift
            heading_style: title
            icon: mdi:television-classic
          - type: tile
            entity: cover.wohnzimmer_controller_tv_lift
            name: TV Lift
            icon: mdi:television-classic
            features:
              - type: cover-open-close
              - type: cover-position
          - type: tile
            entity: sensor.wohnzimmer_controller_tv_lift_lage
            name: Lage
            icon: mdi:arrow-up-down
          - type: tile
            entity: sensor.wohnzimmer_controller_tv_lift_position_mm
            name: Hub
            icon: mdi:ruler
          - type: tile
            entity: input_boolean.wohnzimmer_kino_aktiv
            name: Kino
            icon: mdi:movie-open
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.wohnzimmer_kino
          - type: tile
            entity: input_boolean.wohnzimmer_nacht_aktiv
            name: Gute Nacht
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: perform-action
              perform_action: script.wohnzimmer_gute_nacht

      # -- Licht -------------------------------------------------------------
      # Kaminfeuer flackert absichtlich. Cinema laesst das Sideboard ruhig
      # (statisches Parabelprofil), weil es direkt unter dem Bildschirm steht;
      # das Cabinet bleibt dabei auf dem Museum-Look.
      - type: grid
        cards:
          - type: heading
            heading: Licht
            heading_style: title
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.wohnzimmer_controller_sideboard
            name: Sideboard
            features:
              - type: light-brightness
          - type: tile
            entity: light.wohnzimmer_controller_cabinet
            name: Vitrine
            features:
              - type: light-brightness
          - type: tile
            entity: select.wohnzimmer_controller_livingroom_light_scene
            name: Szene
            icon: mdi:palette
            features:
              - type: select-options
          - type: tile
            entity: number.wohnzimmer_controller_livingroom_effect_intensity
            name: Intensität
            icon: mdi:brightness-percent
            features:
              - type: numeric-input
                style: slider

      # -- Raumklima ---------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Raumklima
            heading_style: title
            icon: mdi:thermometer
          - type: tile
            entity: sensor.wohnzimmer_controller_livingroom_temperature
            name: Raum
          - type: tile
            entity: sensor.wohnzimmer_controller_livingroom_humidity
            name: Luftfeuchte
          - type: tile
            entity: sensor.wohnzimmer_controller_av_receiver_temperature
            name: AV-Receiver
          - type: tile
            entity: sensor.wohnzimmer_controller_cabinet_temperature
            name: Vitrine
          - type: tile
            entity: sensor.wohnzimmer_controller_av_fan_rpm
            name: Lüfter
            icon: mdi:fan

      # -- Leistung ----------------------------------------------------------
      # Nur die Summe und der Tagesverbrauch. Die Einzelwerte je Schiene
      # stehen in der Diagnose, damit hier nichts doppelt erscheint.
      - type: grid
        cards:
          - type: heading
            heading: Leistung & Strom
            heading_style: title
            icon: mdi:flash
          - type: tile
            entity: sensor.wohnzimmer_controller_rail_total_power
            name: Gesamt
          - type: tile
            entity: sensor.wohnzimmer_controller_rail_12v_energy_daily
            name: 12 V heute
          - type: tile
            entity: sensor.wohnzimmer_controller_rail_5v_energy_daily
            name: 5 V heute
          - type: tile
            entity: sensor.wohnzimmer_controller_rail_12v_current
            name: 12 V Strom
            icon: mdi:current-dc
          - type: tile
            entity: sensor.wohnzimmer_controller_rail_5v_current
            name: 5 V Strom
            icon: mdi:current-dc

  # ===========================================================================
  # VERLAUF
  # ===========================================================================
  # Wenige Graphen mit mehreren Kurven statt vieler Einzelkarten: so sind
  # Zusammenhaenge ablesbar, etwa Lüfterdrehzahl gegen Receivertemperatur.
  - title: Verlauf
    path: verlauf
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: TV Lift Position
        hours_to_show: 48
        entities:
          - entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position in Prozent

      - type: history-graph
        title: Temperaturen
        hours_to_show: 24
        entities:
          - entity: sensor.wohnzimmer_controller_livingroom_temperature
            name: Raum
          - entity: sensor.wohnzimmer_controller_av_receiver_temperature
            name: AV-Receiver
          - entity: sensor.wohnzimmer_controller_cabinet_temperature
            name: Vitrine
          - entity: sensor.wohnzimmer_controller_esp_temperature
            name: Controller

      - type: history-graph
        title: Luftfeuchte
        hours_to_show: 24
        entities:
          - entity: sensor.wohnzimmer_controller_livingroom_humidity
            name: Luftfeuchte

      # Beide Kurven zusammen: die Regelung faehrt den Lüfter nach der
      # Receivertemperatur, hier ist zu sehen, ob das greift.
      - type: history-graph
        title: Lüfterregelung
        hours_to_show: 12
        entities:
          - entity: sensor.wohnzimmer_controller_av_fan_rpm
            name: Drehzahl
          - entity: sensor.wohnzimmer_controller_av_fan_duty
            name: Stellwert

      - type: history-graph
        title: Leistung
        hours_to_show: 24
        entities:
          - entity: sensor.wohnzimmer_controller_rail_total_power
            name: Gesamt
          - entity: sensor.wohnzimmer_controller_rail_12v_power
            name: 12 V
          - entity: sensor.wohnzimmer_controller_rail_5v_power
            name: 5 V

      - type: history-graph
        title: Strom 12 V / 5 V
        hours_to_show: 24
        entities:
          - entity: sensor.wohnzimmer_controller_rail_12v_current
            name: 12 V
          - entity: sensor.wohnzimmer_controller_rail_5v_current
            name: 5 V

      - type: statistics-graph
        title: Energie je Tag
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - state
        entities:
          - entity: sensor.wohnzimmer_controller_rail_12v_energy_daily
            name: 12 V
          - entity: sensor.wohnzimmer_controller_rail_5v_energy_daily
            name: 5 V

  # ===========================================================================
  # DIAGNOSE
  # ===========================================================================
  - title: Diagnose
    path: diagnose
    icon: mdi:stethoscope
    type: sections
    max_columns: 3
    sections:
      # -- Lift-Service ------------------------------------------------------
      # Referenzieren: Schalter EIN, wenn der Lift auf der unteren Endlage
      # steht -- das setzt die Position auf 0. AUS verwirft die Referenz, etwa
      # nach Handverstellung im spannungslosen Zustand.
      #
      # Position und Referenz liegen im NVS des ESP32 und ueberstehen
      # Stromausfall und OTA. Geschrieben wird nur bei Fahrtbeginn, Fahrtende
      # und Referenzereignissen, um Flash-Zyklen zu schonen.
      - type: grid
        cards:
          - type: heading
            heading: Lift-Service
            heading_style: title
            icon: mdi:cog
          - type: tile
            entity: switch.wohnzimmer_controller_lift_referenz
            name: Referenz (Ein = untere Endlage)
            icon: mdi:target
          - type: tile
            entity: sensor.wohnzimmer_controller_lift_zustand
            name: Reglerzustand
          - type: tile
            entity: sensor.wohnzimmer_controller_lift_geschwindigkeit
            name: Geschwindigkeit
          - type: tile
            entity: number.wohnzimmer_controller_lift_max_geschwindigkeit
            name: Max. Geschwindigkeit
            features:
              - type: numeric-input
                style: box
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.wohnzimmer_controller_tv_lift_position_pulses
                name: Position in Pulsen
              - entity: sensor.wohnzimmer_controller_tv_lift_position_percent
                name: Position in Prozent

      # -- Stromschienen -----------------------------------------------------
      # 144 Counts/mm, Hub 94500 Counts = 656,25 mm. Der Motor haengt an der
      # 12-V-Schiene: dort ist eine Fahrt als Stromspitze sichtbar.
      - type: grid
        cards:
          - type: heading
            heading: Stromschienen
            heading_style: title
            icon: mdi:current-dc
          - type: entities
            title: 12 V
            show_header_toggle: false
            entities:
              - entity: sensor.wohnzimmer_controller_rail_12v_voltage
                name: Spannung
              - entity: sensor.wohnzimmer_controller_rail_12v_current
                name: Strom
              - entity: sensor.wohnzimmer_controller_rail_12v_power
                name: Leistung
              - entity: sensor.wohnzimmer_controller_rail_12v_shunt_voltage
                name: Shuntspannung
              - entity: binary_sensor.wohnzimmer_controller_rail_12v_overcurrent
                name: Überstrom
          - type: entities
            title: 5 V
            show_header_toggle: false
            entities:
              - entity: sensor.wohnzimmer_controller_rail_5v_voltage
                name: Spannung
              - entity: sensor.wohnzimmer_controller_rail_5v_current
                name: Strom
              - entity: sensor.wohnzimmer_controller_rail_5v_power
                name: Leistung
              - entity: sensor.wohnzimmer_controller_rail_5v_shunt_voltage
                name: Shuntspannung
              - entity: binary_sensor.wohnzimmer_controller_rail_5v_overcurrent
                name: Überstrom

      # -- Controller --------------------------------------------------------
      # Loop-Zeit betrifft nur den ESPHome-Mainloop. Die Lift-Regelung laeuft
      # auf einem eigenen 1-ms-Task auf Kern 1 und ist davon unabhaengig.
      - type: grid
        cards:
          - type: heading
            heading: Controller
            heading_style: title
            icon: mdi:chip
          - type: tile
            entity: binary_sensor.wohnzimmer_controller_api_connected
            name: API verbunden
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.wohnzimmer_controller_uptime
                name: Laufzeit
              - entity: sensor.wohnzimmer_controller_esp_temperature
                name: Temperatur
              - entity: sensor.wohnzimmer_controller_heap_free
                name: Freier Heap
              - entity: sensor.wohnzimmer_controller_loop_time
                name: Loop-Zeit
              - entity: sensor.wohnzimmer_controller_av_fan_duty
                name: Lüfter-Stellwert
              - type: divider
              - entity: sensor.wohnzimmer_controller_ip_address
                name: IP-Adresse
              - entity: sensor.wohnzimmer_controller_mac_address
                name: MAC-Adresse
          - type: tile
            entity: button.wohnzimmer_controller_controller_restart
            name: Controller neu starten
            icon: mdi:restart
