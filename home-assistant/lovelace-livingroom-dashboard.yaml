# =============================================================================
# WOHNZIMMER -- Kompaktes Dashboard (eine Ansicht)
# -----------------------------------------------------------------------------
# Ausfuehrliche Version inklusive Diagnose: home-assistant/dashboards/livingroom.yaml
# Alle Entitaeten gegen das laufende Geraet geprueft. Entfernt wurden die nicht
# mehr existierenden tv_lift_homed, tv_lift_fault, tv_lift_reference und
# tv_lift_clear_fault.
# =============================================================================
title: Wohnzimmer
views:
  - title: Wohnzimmer
    path: wohnzimmer
    icon: mdi:sofa
    cards:
      - type: tile
        entity: cover.wohnzimmer_controller_tv_lift
        name: TV-Lift
        features:
          - type: cover-open-close
          - type: cover-position

      # 0 % = untere Endlage, 100 % = obere Endlage. Vor dem Referenzieren
      # bleiben Prozent und mm ohne Wert; referenziert wird ueber den Schalter.
      - type: entities
        title: TV-Lift
        show_header_toggle: false
        entities:
          # Sprechende Lage statt geoeffnet/geschlossen aus der Cover-Domain.
          - entity: sensor.wohnzimmer_controller_tv_lift_lage
            name: Lage
          - entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position
          - entity: sensor.wohnzimmer_controller_tv_lift_position_mm
            name: Position (mm)
          - entity: switch.wohnzimmer_controller_lift_referenz
            name: Referenziert
          - entity: sensor.wohnzimmer_controller_lift_geschwindigkeit
            name: Geschwindigkeit

      - type: entities
        title: Licht
        entities:
          - entity: light.wohnzimmer_controller_sideboard
          - entity: light.wohnzimmer_controller_cabinet
          - entity: select.wohnzimmer_controller_livingroom_light_scene
            name: Szene
          - entity: number.wohnzimmer_controller_livingroom_effect_intensity
            name: Intensitaet

      # Positionsverlauf analog zu den Temperaturkarten.
      - type: grid
        title: TV-Lift Verlauf
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.wohnzimmer_controller_tv_lift_position_percent
            name: Position
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.wohnzimmer_controller_tv_lift_position_mm
            name: Hub (mm)
            graph: line
            hours_to_show: 6

      - type: entities
        title: Umgebung
        show_header_toggle: false
        entities:
          - entity: sensor.wohnzimmer_controller_livingroom_temperature
            name: Raum Temperatur
          - entity: sensor.wohnzimmer_controller_livingroom_humidity
            name: Luftfeuchte
          - entity: sensor.wohnzimmer_controller_av_receiver_temperature
            name: AV Receiver
          - entity: sensor.wohnzimmer_controller_cabinet_temperature
            name: Cabinet
          - entity: sensor.wohnzimmer_controller_av_fan_rpm
            name: Luefter Drehzahl
          - entity: sensor.wohnzimmer_controller_rail_total_power
            name: Leistung gesamt
