# VITRINE SPOTS (27 virtuelle Pixel = 3x9 Spots).
# Im manuellen Modus steuert diese Partition eigene Farbe/Helligkeit.
# Bei Szenen mit Museum-Effekt rendern Glass und Spots je ihren Anteil.

# MUSEUM: Spots kraeftig warmweiss. Reveal von unten nach oben (synchron mit
# dem Kanten-Effekt auf Vitrine Glass). Pre-Gamma-Werte.
- addressable_lambda:
    name: "Museum"
    update_interval: 33ms
    lambda: |-
      // 27 virtuelle Pixel: 0..8 = Spot Unten, 9..17 = Spot Mitte, 18..26 = Spot Oben
      static float phase;
      if (initial_run) phase = 0.0f;
      phase += 0.02f;
      if (phase > 4.0f) phase = 4.0f;
      for (int shelf = 0; shelf < 3; shelf++) {
        float lv = phase - shelf * 0.6f;
        if (lv < 0.0f) lv = 0.0f;
        if (lv > 1.0f) lv = 1.0f;
        float sp = (lv - 0.25f) / 0.75f;
        if (sp < 0.0f) sp = 0.0f;
        if (sp > 1.0f) sp = 1.0f;
        const int base = shelf * 9;
        const uint8_t sr = (uint8_t)(150 * sp);
        const uint8_t sg = (uint8_t)(70 * sp);
        const uint8_t sw = (uint8_t)(255 * sp);
        for (int i = 0; i < 9; i++)
          it[base + i] = Color(sr, sg, 0, sw);
      }

# FIREPLACE: reflektiertes Kaminlicht (rendert alle 102 px ueber RawPixelOutput).
- fireplace:
    name: "Fireplace"
    raw_output_id: cabinet_glass_edge_out
    role: REFLECTION
    update_interval: 20ms
    intensity: 100%
    output_gain: 50%
    green_gain: 100%
    white_gain: 100%

- addressable_fireworks:
    name: "Fireworks"
